  - id: CVE-2026-9538
    paths:
      - "**/portfolio-api (debian 13.*)"
    statement: >-
      Place : perl-base, paquet essentiel de Debian venu de l'image de base, impossible à
      retirer. Atteinte : non — le défaut est dans le module `Archive::Tar`, absent de perl-base,
      et l'application n'exécute pas Perl. Alternatives : correctif reporté par Debian
      (`fix_deferred`) ; corrigé en amont par Archive::Tar 3.10.
    expired_at: 2026-12-29

  - id: CVE-2026-75804
    paths:
      - "**/portfolio-api (debian 13.*)"
    statement: >-
      Place : OpenSSL, venu de l'image de base, dont dépend le module `ssl` de Python. Atteinte :
      non — le défaut est dans la pile QUIC d'OpenSSL ; Python ne fait que du TLS sur TCP, et
      rien dans l'image n'ouvre de connexion QUIC. Alternatives : corrigé dans Debian 13 par
      `3.5.7-1~deb13u3`, absent de l'image `python:3.12.14-slim-trixie` publiée (construite le
      2026-09-19) — monter l'empreinte dès sa reconstruction (ADR 0014) ; pas d'`apt-get upgrade`
      au build, qui ferait dépendre l'image de sa date de construction.
    expired_at: 2026-10-30

  - id: CVE-2026-84782
    paths:
      - "**/portfolio-api (debian 13.*)"
    statement: >-
      Place : OpenSSL, venu de l'image de base, dont dépend le module `ssl` de Python. Atteinte :
      non — le défaut est dans la retransmission DTLS ; Python ne fait que du TLS sur TCP, et
      rien dans l'image n'ouvre de connexion DTLS. Alternatives : corrigé dans Debian 13 par
      `3.5.7-1~deb13u3`, absent de l'image `python:3.12.14-slim-trixie` publiée (construite le
      2026-09-19) — monter l'empreinte dès sa reconstruction (ADR 0014) ; pas d'`apt-get upgrade`
      au build, qui ferait dépendre l'image de sa date de construction.
    expired_at: 2026-10-30

  - id: CVE-2026-103111
    paths:
      - "**/portfolio-api (debian 13.*)"
    statement: >-
      Place : libpcre2-8-0, venu de l'image de base, dépendance de `grep`, paquet essentiel de
      Debian, et de `libselinux1`. Atteinte : non — le défaut demande de compiler, avec le JIT,
      une expression régulière forgée par l'attaquant ; seuls `grep` et `libselinux1` lient la
      bibliothèque, ni Python ni l'environnement de l'application (mesuré), rien de ce qui tourne
      n'appelle `grep`, et `libselinux1` ne compile que les motifs d'une politique SELinux,
      absente de l'image.
      Alternatives : corrigé dans Debian 13 par `10.46-1~deb13u3`, absent de l'image
      `python:3.12.14-slim-trixie` publiée (construite le 2026-09-19, empreinte inchangée au
      2026-10-02) — monter l'empreinte dès sa reconstruction (ADR 0014) ; pas
      d'`apt-get upgrade` au build, qui ferait dépendre l'image de sa date de construction.
    expired_at: 2026-11-01

  # --- Image `caddy` : le binaire `caddy` 2.11.7, compilé avec Go 1.26.8 ----------------------
  #
  # Ce qui tourne : le Caddyfile de production (`infra/caddy/Caddyfile`) — un serveur de fichiers
  # statiques et un reverse proxy interne vers `api`, routés par nom d'hôte, en HTTP, sans TLS ni
  # certificat : Cloudflare le termine, `cloudflared` est la seule entrée (cadrage §7, D45).
  # HTTP/1.1 seulement (`protocols h1`) ; ni `templates`, ni `file_server browse`, ni `tracing`,
  # ni amont en HTTPS. L'atteinte est jugée sur cette configuration, pas sur un graphe d'appels :
  # `govulncheck` trouve tous les symboles vulnérables dans le binaire, qui embarque tous les
  # modules de Caddy.
  # La version de Go est celle que Trivy lit dans le binaire (`stdlib v1.26.8`, scan du
  # 2026-10-18, montée de #125) : la montée en 2.11.7 a retiré 16 des 19 exceptions de 2.11.4.
  #
  # Alternatives, pour toutes : caddy 2.11.7 (2026-10-03) est la dernière version publiée ; la
  # suivante arrivera par Dependabot. Si elle tarde, compiler caddy dans un étage du projet
  # (ADR 0014, « Conditions de réexamen »).

  - id: CVE-2026-78667
    paths:
      - usr/bin/caddy
    statement: >-
      Place : bibliothèque standard Go (`net/http`) du binaire `caddy`, raison d'être de l'image.
      Atteinte : non — le défaut est l'absence de borne sur la taille d'un `Range` analysé par un
      serveur, et le seul analyseur de l'image est `file_server` (`net/http.ServeContent`) ;
      `infra/caddy/Caddyfile` retire `Range` des requêtes de l'hôte du site
      (`request_header -Range`), et le test de fumée de l'image vérifie qu'un `Range` sur un
      fichier haché rend 200 et le corps entier, jamais 206. Les routes `reverse_proxy`
      transmettent l'en-tête sans le lire. Alternatives : corrigé par Go 1.26.9 et 1.27.2,
      absents de caddy 2.11.7, dernière version publiée, compilée avec Go 1.26.8.
    expired_at: 2027-01-16

  - id: CVE-2026-78669
    paths:
      - usr/bin/caddy
    statement: >-
      Place : bibliothèque standard Go (`net/http`) et module `golang.org/x/net` du binaire
      `caddy`, raison d'être de l'image. Atteinte : non — le défaut consomme le processeur d'un
      serveur **HTTP/2** par des changements répétés de fenêtre initiale ;
      `infra/caddy/Caddyfile` restreint ses serveurs à HTTP/1.1 (`protocols h1`), et le test de
      fumée vérifie que la préface `h2c` ne reçoit aucune réponse HTTP/2. Alternatives : corrigé
      par Go 1.26.9 et 1.27.2 et par x/net 0.60.0, absents de caddy 2.11.7, dernière version
      publiée, compilée avec Go 1.26.8 et x/net 0.59.0.
    expired_at: 2027-01-16

  - id: CVE-2026-97031
    paths:
      - usr/bin/caddy
    statement: >-
      Place : bibliothèque standard Go (`crypto/tls`) du binaire `caddy`, raison d'être de
      l'image. Atteinte : non — le défaut vise un serveur TLS qui traite des références
      d'extension externe ECH dans un `ClientHello`, et Caddy n'en termine aucun : Cloudflare le
      fait (D45), Caddy n'écoute qu'en HTTP derrière `cloudflared`. Alternatives : corrigé par Go
      1.26.9 et 1.27.2, absents de caddy 2.11.7, dernière version publiée, compilée avec Go
      1.26.8.
    expired_at: 2027-01-16

  # --- Image `backup` : les binaires Go `age`, `age-keygen` et `supercronic` ------------------
  #
  # Ce qui tourne : `supercronic`, puis la chaîne de `infra/backup/backup.sh` une fois par nuit,
  # sous l'utilisateur `backup`, sans privilège. `age` chiffre le dump (`backup.sh`),
  # `age-keygen` engendre la paire des tests, `supercronic` ordonnance. L'image **n'écoute sur
  # aucun port** : aucun `EXPOSE`, aucun serveur dans la chaîne. `rclone` n'y figure plus depuis
  # la 1.75.2, qui l'a reconstruit avec Go 1.26.9 : son exception a été retirée, pas déplacée.
  #
  # Les trois binaires portent la même bibliothèque standard Go vulnérable — `age` et
  # `age-keygen` en v1.27.0, `supercronic` en v1.26.6 —, et les trois mêmes avis. `age` 1.3.2
  # (2026-08-29) et `supercronic` 0.2.49 (2026-08-14) sont les **dernières versions publiées**,
  # toutes deux antérieures à Go 1.26.9 : leur correctif n'attend qu'une release amont, que
  # Dependabot ne propose pas pour un fichier de release épinglé par somme. D'où la fenêtre
  # courte de 30 jours, et non 90.

  - id: CVE-2026-78667
    paths:
      - usr/local/bin/age
      - usr/local/bin/age-keygen
      - usr/local/bin/supercronic
    statement: >-
      Place : bibliothèque standard Go des trois binaires, chacun nécessaire à l'image — `age`
      chiffre le dump, `age-keygen` engendre la paire des tests, `supercronic` ordonnance la
      nuit. Atteinte : non — le défaut est l'absence de borne sur la taille d'un en-tête `Range`
      analysé par un **serveur** HTTP ; l'image n'écoute sur aucun port, aucun des trois
      binaires ne sert de HTTP, et `age` ne fait que lire et écrire des fichiers.
      Alternatives : corrigé par Go 1.26.9 et 1.27.2, absents de `age` 1.3.2 et `supercronic`
      0.2.49, dernières versions publiées ; la suivante de chacune arrivera reconstruite.
    expired_at: 2026-11-10

  - id: CVE-2026-78669
    paths:
      - usr/local/bin/age
      - usr/local/bin/age-keygen
      - usr/local/bin/supercronic
    statement: >-
      Place : bibliothèque standard Go des trois binaires, chacun nécessaire à l'image — `age`
      chiffre le dump, `age-keygen` engendre la paire des tests, `supercronic` ordonnance la
      nuit. Atteinte : non — le défaut consomme le processeur d'un **serveur** HTTP/2 qui reçoit
      des `SETTINGS` de fenêtre répétés ; l'image n'écoute sur aucun port, et aucun des trois
      binaires n'ouvre de connexion HTTP/2 entrante ni sortante dans la chaîne de sauvegarde.
      Alternatives : corrigé par Go 1.26.9 et 1.27.2, absents de `age` 1.3.2 et `supercronic`
      0.2.49, dernières versions publiées ; la suivante de chacune arrivera reconstruite.
    expired_at: 2026-11-10

  - id: CVE-2026-97031
    paths:
      - usr/local/bin/age
      - usr/local/bin/age-keygen
      - usr/local/bin/supercronic
    statement: >-
      Place : bibliothèque standard Go des trois binaires, chacun nécessaire à l'image — `age`
      chiffre le dump, `age-keygen` engendre la paire des tests, `supercronic` ordonnance la
      nuit. Atteinte : non — le défaut vise un pair TLS qui traite des références d'extension
      externe ECH dans un `ClientHello` ; aucun des trois ne termine de TLS entrant, et le
      chiffrement d'`age` est le sien (X25519 sur fichier), pas celui de `crypto/tls`.
      Alternatives : corrigé par Go 1.26.9 et 1.27.2, absents de `age` 1.3.2 et `supercronic`
      0.2.49, dernières versions publiées ; la suivante de chacune arrivera reconstruite.
    expired_at: 2026-11-10
