  - id: CVE-2026-124709
    paths:
      - "**/portfolio-api (debian 13.*)"
    statement: >-
      Place : `libssl3t64`, `openssl` et `openssl-provider-legacy` (OpenSSL 3.5.7), venus de
      l'image de base, dont dépendent les modules `ssl` et `hashlib` de Python. Atteinte : non —
