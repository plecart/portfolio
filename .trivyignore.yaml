      ce paquet par erreur, comme l'avis GitHub GHSA-g84c-rxfj-3j2c ; NVD, OSV et le tracker
      Debian le donnent à zlib. Alternatives : corrigé dans sid
      (1:1.3.dfsg+really1.3.2-4, bogue Debian 1153063), sans correctif dans Debian 13.
