# Exceptions du scan des images (`make scan`), lues par Trivy (`--ignorefile`).
#
# Le scan bloque toute vulnérabilité HIGH ou CRITICAL, corrigeable ou non (ADR 0014). Une
# vulnérabilité sans correctif pour l'image arrête la CI le temps d'une évaluation en trois
# points, que le `statement` de son exception résume :
#
#   1. Place — le composant fautif a-t-il sa place dans l'image ?
#   2. Atteinte — le code vulnérable est-il atteint par ce qui tourne ?
#   3. Alternatives — autre image de base, retrait du paquet, correctif annoncé.
#
# Est sans correctif, pour l'image, ce qui est corrigé en amont mais absent de toute version
# publiée de ce qui l'embarque. Une exception ne sert jamais à faire passer une PR : si
# l'évaluation conclut que le code est atteint, on corrige l'image.
#
# Une entrée par vulnérabilité, les quatre champs obligatoires, aucun autre :
#
#   - id: CVE-2026-0001          # l'identifiant rapporté par Trivy
#     paths:                     # l'image pour laquelle l'évaluation vaut, par la cible que
#       - usr/bin/caddy          # nomme le rapport de Trivy : le chemin d'un binaire, ou
#                                # "**/portfolio-<service> (<système> <version>.*)" pour les
#                                # paquets du système
#     statement: >-              # les trois points, dans l'ordre
#       Place : … Atteinte : … Alternatives : …
#     expired_at: 2026-12-29     # date YAML sans guillemets ; l'exception cesse de valoir à
#                                # 00:00 UTC ce jour-là, et l'évaluation se refait
#
# « Atteint par ce qui tourne » se juge image par image, et ce fichier vaut pour toutes : sans
# `paths`, une image ajoutée hériterait des exceptions des autres, scan vert, sans évaluation.
# Les exceptions des paquets du système suivent le nom de l'image, `portfolio-<service>`, quel que
# soit le registre placé devant ; celles d'un binaire suivent son chemin, dans toute image qui le
# porte.
#
# Durée d'une exception : 90 jours au plus. 30 jours quand l'évaluation attend quelque chose — un
# correctif qui n'attend que la reconstruction d'une image de base sous la même étiquette, que
# Dependabot peut ne pas proposer, ou une atteinte qui n'a pas pu être établie.
#
# Une « Atteinte : non » qui repose sur un comportement de l'outil — un défaut, une option
# inactive, un protocole refusé — cite le test qui l'exerce sur l'image (`make image-test`) ; sans
# test, elle s'écrit « non établie » et prend 30 jours. Mesuré sur CVE-2026-56853 : « `h2c`
# inactif par défaut » était faux, Caddy 2.11.4 servait HTTP/2 en clair (exception retirée par la
# montée en 2.11.7, #125).
#
# `apps/api/tests/test_image_scan.py` refuse une entrée incomplète, expirée, ou datée au-delà de
# 90 jours.
#
# Chaque exception a été évaluée avec Trivy 0.74.0, au scan du jour qui précède son `expired_at`
# de sa durée (30 ou 90 jours, ci-dessus).

vulnerabilities:
  # --- Image `api` : paquets Debian 13 de l'image de base `python:3.12.15-slim-trixie` -------
  #
  # Ce qui tourne : gunicorn et, pour le service `worker`, celery, sous l'utilisateur `api`, sans
  # privilège. Mesuré dans l'image : `/etc/fstab` est vide, ni `systemd-homed` ni le module Perl
  # `Archive::Tar` n'y sont. Le shell `sqlite3` n'y est pas non plus, et aucun processus de
  # gunicorn ni de celery ne mappe `libsqlite3` (`/proc/<pid>/maps`, 2026-11-01 ; témoin : présente
  # après `import sqlite3`).

  - id: CVE-2026-76642
    paths:
      - "**/portfolio-api (debian 13.*)"
    statement: >-
      Place : util-linux (`mount`, `login`, `bsdutils` et leurs bibliothèques), paquets essentiels
      de Debian venus de l'image de base, impossibles à retirer. Atteinte : non — le défaut
      demande une entrée de `/etc/fstab` qui autorise un montage à un utilisateur, et celui de
      l'image est vide. Alternatives : aucun correctif dans Debian 13 ; une image de base sans
      util-linux rouvrirait le choix de Debian 13 (ADR 0014).
    expired_at: 2026-12-29

  - id: CVE-2026-78408
    paths:
      - "**/portfolio-api (debian 13.*)"
    statement: >-
      Place : util-linux, paquets essentiels de Debian venus de l'image de base, impossibles à
      retirer. Atteinte : non — le défaut demande qu'un opérateur privilégié lance
      `nsenter --join-cgroup`, que rien dans l'image n'appelle. Alternatives : aucun correctif
      dans Debian 13 ; une image de base sans util-linux rouvrirait le choix de Debian 13
      (ADR 0014).
    expired_at: 2026-12-29

  - id: CVE-2026-78409
    paths:
      - "**/portfolio-api (debian 13.*)"
    statement: >-
      Place : util-linux, paquets essentiels de Debian venus de l'image de base, impossibles à
      retirer. Atteinte : non — le défaut demande une entrée de `/etc/fstab` portant
      `X-mount.subdir`, et celui de l'image est vide. Alternatives : aucun correctif dans
      Debian 13 ; une image de base sans util-linux rouvrirait le choix de Debian 13 (ADR 0014).
    expired_at: 2026-12-29

  - id: CVE-2026-78410
    paths:
      - "**/portfolio-api (debian 13.*)"
    statement: >-
      Place : util-linux, paquets essentiels de Debian venus de l'image de base, impossibles à
      retirer. Atteinte : non — le défaut demande une entrée de `/etc/fstab` qui autorise un
      montage lié à un utilisateur, et celui de l'image est vide. Alternatives : aucun correctif
      dans Debian 13 ; une image de base sans util-linux rouvrirait le choix de Debian 13
      (ADR 0014).
    expired_at: 2026-12-29

  - id: CVE-2026-54369
    paths:
      - "**/portfolio-api (debian 13.*)"
    statement: >-
      Place : libacl1, dépendance des paquets essentiels de Debian (coreutils), venue de l'image
      de base. Atteinte : non — le défaut demande un processus privilégié qui lit ou pose des
      ACL sur un chemin que l'attaquant contrôle ; le seul processus de l'image est gunicorn,
      sans privilège, qui n'appelle pas libacl. Alternatives : corrigé en amont par acl 2.4.0,
      sans correctif dans Debian 13.
    expired_at: 2026-12-29

  - id: CVE-2025-69720
    paths:
      - "**/portfolio-api (debian 13.*)"
    statement: >-
      Place : ncurses, paquets essentiels de Debian venus de l'image de base. Atteinte : non —
      le défaut est dans la commande `infocmp`, présente dans l'image mais que rien n'appelle.
      Alternatives : corrigé en amont par ncurses 6.5-20251213, sans correctif dans Debian 13.
    expired_at: 2026-12-29

  - id: CVE-2026-16742
    paths:
      - "**/portfolio-api (debian 13.*)"
    statement: >-
      Place : libsystemd0 et libudev1, bibliothèques dont dépendent les paquets essentiels de
      Debian, venues de l'image de base. Atteinte : non — le défaut est dans le service
      `systemd-homed`, absent de l'image. Alternatives : aucun correctif dans Debian 13.
    expired_at: 2026-12-29

  - id: CVE-2026-9538
    paths:
      - "**/portfolio-api (debian 13.*)"
    statement: >-
      Place : perl-base, paquet essentiel de Debian venu de l'image de base, impossible à
      retirer. Atteinte : non — le défaut est dans le module `Archive::Tar`, absent de perl-base,
      et l'application n'exécute pas Perl. Alternatives : correctif reporté par Debian
      (`fix_deferred`) ; corrigé en amont par Archive::Tar 3.10.
    expired_at: 2026-12-29

  - id: CVE-2026-119373
    paths:
      - "**/portfolio-api (debian 13.*)"
    statement: >-
      Place : libsqlite3-0, venue de l'image de base, impossible à retirer — `liblastlog2-2` en
      dépend, et `util-linux`, paquet essentiel, en pré-dépend. Atteinte : non — le défaut demande
      d'écrire dans une table FTS5 `detail=none`, puis d'y lancer une requête `MATCH` ; rien
      n'ouvre de base SQLite : `DATABASES` ne nomme que PostgreSQL, seul le moteur
      `django.db.backends.sqlite3` importe `sqlite3`, et la bibliothèque n'est mappée par aucun
      processus de gunicorn ni de celery. Alternatives : corrigé en amont par SQLite 3.54.0, sans
      correctif dans Debian 13 ni dans sid (bogue Debian 1152790) ; `python:3.12.16-slim-trixie`
      porte le même paquet.
    expired_at: 2027-01-30

  - id: CVE-2026-119586
    paths:
      - "**/portfolio-api (debian 13.*)"
    statement: >-
      Place : libsqlite3-0, venue de l'image de base, impossible à retirer — `liblastlog2-2` en
      dépend, et `util-linux`, paquet essentiel, en pré-dépend. Atteinte : non — le défaut est
      dans la commande `.recover` du shell `sqlite3`, absent de l'image : le paquet `sqlite3` n'y
      est pas installé. Alternatives : aucun correctif dans Debian 13 ni dans sid (bogue Debian
      1152790) ; `python:3.12.16-slim-trixie` porte le même paquet.
    expired_at: 2027-01-30

  # --- Image `caddy` : le binaire `caddy` 2.11.7, compilé par le projet avec Go 1.27.3 ---------
  #
  # Ce qui tourne : le Caddyfile de production (`infra/caddy/Caddyfile`) — un serveur de fichiers
  # statiques et un reverse proxy interne vers `api`, routés par nom d'hôte, en HTTP, sans TLS ni
  # certificat : Cloudflare le termine, `cloudflared` est la seule entrée (cadrage §7, D45).
  # HTTP/1.1 seulement (`protocols h1`) ; ni `templates`, ni `file_server browse`, ni `tracing`,
  # ni `acme_server`, ni amont en HTTPS. L'atteinte est jugée sur cette configuration, pas sur un
  # graphe d'appels : `govulncheck` trouve tous les symboles vulnérables dans le binaire, qui
  # embarque tous les modules de Caddy.
  # Les versions sont celles que Trivy 0.74.0 lit dans le binaire au scan du 2026-10-21 : `caddy`
  # v2.11.7, `stdlib` v1.27.3, `golang.org/x/net` v0.59.0. Le projet compile caddy avec le Go de
  # l'image `golang` épinglée, ses modules aux versions que fixe sa release (ADR 0018) : la
  # bibliothèque standard n'y porte plus d'exception, seuls ses modules en gardent.

  - id: CVE-2026-78669
    paths:
      - usr/bin/caddy
    statement: >-
      Place : module `golang.org/x/net` v0.59.0 du binaire `caddy`, raison d'être de l'image, à
      la version que fixe la release de caddy 2.11.7. Atteinte : non — le défaut consomme le
      processeur d'un serveur **HTTP/2** par des changements répétés de fenêtre initiale ;
      `infra/caddy/Caddyfile` restreint ses serveurs à HTTP/1.1 (`protocols h1`), et le test de
      fumée vérifie que la préface `h2c` ne reçoit aucune réponse HTTP/2. Alternatives : corrigé
      par x/net 0.60.0, absent de caddy 2.11.7, dernière version publiée ; le projet ne monte pas
      un module au-delà de ce que fixe la release (ADR 0018).
    expired_at: 2027-01-19

  - id: CVE-2026-116587
    paths:
      - usr/bin/caddy
    statement: >-
      Place : modules `github.com/go-jose/go-jose/v3` v3.0.5 et `/v4` v4.1.5 du binaire `caddy`,
      aux versions que fixe la release de caddy 2.11.7, tirés par l'autorité de certification de
      smallstep (`go.step.sm/crypto/jose`, `coreos/go-oidc`) qu'embarque `caddypki` (mesuré par
      `go list -deps` sur le module du Dockerfile, 2026-10-28). Atteinte : non — le défaut épuise
      le processeur à l'analyse d'une clé JWK RSA ; Caddy n'en analyse une venue du réseau que
      dans son serveur ACME, monté par le handler `acme_server`, absent de `infra/caddy/Caddyfile`
      — le test de fumée vérifie qu'il manque à la configuration adaptée. Alternatives : v4 corrigé
      par 4.1.6, v3 sans correctif, ni l'un ni l'autre dans caddy 2.11.7, dernière version
      publiée ; le projet ne monte pas un module au-delà de ce que fixe la release (ADR 0018).
    expired_at: 2027-01-26
