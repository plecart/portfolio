# Production, sur le VPS (cadrage §5.3, ADR 0002) : `cloudflared`, `caddy`, `api`, `worker`,
# `postgres`, `redis` et `backup` sur le réseau privé du projet, aucun port publié — `cloudflared`
# sort vers Cloudflare et c'est la seule entrée (D45).
#
# Le pendant de `compose.dev.yml` (ADR 0012) : mêmes images — épingle comprise pour Postgres et
# Redis —, même point d'entrée, mêmes services de données, le même `worker` (D60, ADR 0016) ; le
# reste est propre à la production.
# `apps/api/tests/test_compose.py` tient cet invariant.
#
# **Les variables** viennent du `.env` du VPS, à côté de ce fichier : Compose le lit pour
# l'interpolation `${…}`, et `infra/bootstrap.sh` l'écrit depuis les secrets. `prod.env.example`
# les déclare toutes, aux valeurs factices : c'est avec lui que `make compose-config` résout ce
# fichier. Chacune est exigée (`:?`) : absente, la résolution échoue au lieu de démarrer un service
# sur une valeur vide. Une seule exception, `SENTRY_DSN`, facultative (`:-`) : vide, `api` et
# `worker` ne remontent rien à Sentry — ainsi tournent les piles jetables, sur `prod.env.example`.
# Aucun `env_file:` : chaque service reçoit les siennes et elles seules — le jeton du Tunnel ne va
# qu'à `cloudflared`.
#
# `restart: unless-stopped` partout : un conteneur arrêté par une panne ou par un redémarrage du
# VPS repart seul (cadrage §6.7, « politiques de redémarrage »).
#
# **Une sonde par service** : le déploiement attend la pile par `docker compose up -d --wait`, qui
# n'attend d'un service sans sonde que l'état « en marche » — et `unless-stopped` le lui rend même
# quand le conteneur sort aussitôt en erreur : la commande réussit sur un conteneur qui boucle.
# Avec une sonde, elle échoue (« is unhealthy ») — mesuré sur Compose 5.0.2, PR #71.
# `apps/api/tests/test_compose.py` exige une sonde de chaque service.

# Les sondes des services applicatifs : toutes les 2 s au démarrage, pour que `--wait` rende la
# main dès qu'ils répondent, puis toutes les 30 s — une sonde coûte un processus dans le conteneur.
# Un service qui tourne sans jamais devenir sain est déclaré malade au bout de 3 minutes environ
# (2 de démarrage, 3 échecs) ; un service qui boucle, dès sa première sortie. `start_interval`
# demande Docker Engine 25 ou plus : le VPS l'installe depuis le dépôt de Docker (brief de #16,
# décision 7).
x-probe-timing: &probe-timing
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 2m
  start_interval: 2s

name: portfolio

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    # Le point d'entrée de l'image est `cloudflared --no-autoupdate` : la version est celle de
    # l'épingle, que Dependabot monte. Le Tunnel est géré depuis Cloudflare, qui route les noms
    # d'hôte vers `http://caddy:80` (#25) ; `tunnel run` lit son jeton dans `TUNNEL_TOKEN`.
    command: [tunnel, run]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
      # Le serveur de métriques, que la sonde interroge : dans le conteneur seulement — par défaut,
      # il écoute sur toutes les interfaces, donc sur le réseau du projet.
      TUNNEL_METRICS: 127.0.0.1:20241
    # Sain quand le Tunnel tient au moins une connexion vers Cloudflare (`/ready`). L'image n'a
    # pas de shell : la sonde est le binaire lui-même, qui lit la même adresse dans l'environnement.
    healthcheck:
      <<: *probe-timing
      test: [CMD, cloudflared, tunnel, ready]
    restart: unless-stopped

  caddy:
    # Les images du dépôt, telles que le job `publish` les a poussées, à l'étiquette du commit que
    # le job de déploiement fixe — jamais `latest` sur le VPS, qu'une publication croisée peut
    # laisser sur l'avant-dernier commit (`ci.yml`, job `publish`) ; seul le test de restauration
    # mensuel, sur un runner, tire `latest` (`.github/workflows/restore.yml`).
    image: ghcr.io/plecart/portfolio-caddy:${IMAGE_TAG:?}
    # Les noms d'hôte que le Caddyfile lit (`infra/caddy/Caddyfile`).
    environment:
      SITE_HOST: ${SITE_HOST:?}
      API_HOST: ${API_HOST:?}
      MEDIA_HOST: ${MEDIA_HOST:?}
    # Sain quand l'hôte du site sert sa page HTML. Le contenu compte, pas le code : à un hôte qu'aucun
    # bloc du Caddyfile ne sert, Caddy rend un 200 vide (mesuré à la relecture de la PR #71).
    healthcheck:
      <<: *probe-timing
      test: [CMD-SHELL, 'wget -q -O - --header "Host: $$SITE_HOST" http://127.0.0.1/ | grep -q "<html"']
    restart: unless-stopped

  api:
    image: ghcr.io/plecart/portfolio-api:${IMAGE_TAG:?}
    # Chaque variable de `Env`, sauf `DEBUG` : absente, elle vaut faux. Les adresses désignent les
    # services par leur nom. Ancrées pour que le `worker` les reprenne telles quelles.
    environment: &app-environment
      SECRET_KEY: ${SECRET_KEY:?}
      # Les deux hôtes que Caddy relaie vers `api` : celui de l'API, et celui du site pour
      # `/projets/*`, `/sitemap.xml` et `/llms.txt` (ADR 0030). Caddy transmet `Host` tel quel (doc
      # Caddy « reverse_proxy », § Headers).
      ALLOWED_HOSTS: '["${SITE_HOST:?}","${API_HOST:?}"]'
      # La seule origine admise à appeler l'API : le site (ADR 0008), toujours en HTTPS.
      CORS_ALLOWED_ORIGINS: '["https://${SITE_HOST:?}"]'
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://redis:6379/0
      # Les fichiers téléversés sur R2 (ADR 0004) : le bucket public des images, distinct de celui
      # des sauvegardes, et leurs adresses sur l'hôte des médias, que le CDN sert.
      MEDIA_STORAGE: r2
      MEDIA_HOST: ${MEDIA_HOST:?}
      MEDIA_R2_ENDPOINT: ${MEDIA_R2_ENDPOINT:?}
      MEDIA_R2_BUCKET: ${MEDIA_R2_BUCKET:?}
      MEDIA_R2_ACCESS_KEY_ID: ${MEDIA_R2_ACCESS_KEY_ID:?}
      MEDIA_R2_SECRET_ACCESS_KEY: ${MEDIA_R2_SECRET_ACCESS_KEY:?}
      # Sans usage avec R2, sans volume (#25) : ce fichier porte chaque champ d'`Env` (`test_compose.py`).
      MEDIA_ROOT: /app/media
      # Le compte unique de l'admin, que `ensure_superuser` pose au démarrage d'`api`
      # (`infra/api/entrypoint.sh`) ; le `worker`, qui ne joue aucune étape, n'en fait rien.
      ADMIN_USERNAME: ${ADMIN_USERNAME:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      # Le gabarit des aperçus de lien : l'`index.html` compilé que l'image copie là (ADR 0014).
      # C'est le défaut d'`Env`, écrit comme chaque champ (`test_compose.py`) ; le `worker` n'en
      # fait rien.
      LINK_PREVIEW_TEMPLATE: /app/web/index.html
      # Le DSN du projet Sentry, où `api` et `worker` remontent leurs erreurs (ADR 0027) ; la seule
      # variable facultative (en-tête de ce fichier).
      SENTRY_DSN: ${SENTRY_DSN:-}
    # `api` joue les migrations à son démarrage (`infra/api/entrypoint.sh`) : la base doit répondre.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Sain quand Django répond par un succès ou une redirection à la page de connexion de l'admin
    # (ADR 0001), sous un nom d'hôte qu'il accepte : migrations jouées, `gunicorn` et ses workers
    # en place, table de routage chargée. Une page qui n'interroge pas la base et n'écrit aucun
    # journal, contrairement à une 404.
    healthcheck:
      <<: *probe-timing
      test:
        - CMD
        - python
        - -c
        - >-
          import http.client, json, os;
          c = http.client.HTTPConnection("127.0.0.1", 8000, timeout=5);
          c.request("GET", "/admin/login/", headers={"Host": json.loads(os.environ["ALLOWED_HOSTS"])[0]});
          exit(c.getresponse().status >= 400)
    restart: unless-stopped

  # Le worker d'images (ADR 0015) : l'image d'`api`, à la même étiquette, et une autre commande ;
  # mêmes variables — le bucket des médias, où il lit l'original et écrit les variantes.
  worker:
    image: ghcr.io/plecart/portfolio-api:${IMAGE_TAG:?}
    environment:
      <<: *app-environment
      # Vide : le point d'entrée ne joue aucune étape — c'est `api` qui migre (`entrypoint.sh`).
      STARTUP_STEPS: ""
    # Un seul processus de traitement : un VPS de 2 Go partagé avec Postgres et Redis (ADR 0023).
    command: [celery, -A, config, worker, --loglevel, info, --concurrency, "1"]
    # `api` sain : ses migrations sont jouées avant le premier traitement.
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Sain quand son propre nœud répond — `celery@<nom d'hôte>`, le nom que Celery lui donne —, ce
    # qui prouve aussi que le broker est joint ; rien de l'état d'une tâche. Délai plus long que
    # celui des autres sondes : la commande charge Django avant d'interroger le nœud.
    healthcheck:
      <<: *probe-timing
      test: [CMD-SHELL, celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 10]
      timeout: 30s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # La sonde de `compose.dev.yml`, et pour la même raison : `-h 127.0.0.1` mesure le réseau, dont
    # `api` dépend, pas le socket local, prêt avant lui.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    # Le cache de l'API et la file du worker partagent ce Redis : 64 Mo au plus sur un VPS de 2 Go
    # (ADR 0023), et à la borne Redis n'évince que des clés à durée de vie — celles du cache,
    # jamais la file du broker (ADR 0015 ; brief de #11, décision 6). Même commande sur le poste.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # La sauvegarde nocturne de la base (ADR 0007, `infra/backup/`). Production seulement : absente de
  # `compose.dev.yml` (cadrage §7, D54).
  backup:
    image: ghcr.io/plecart/portfolio-backup:${IMAGE_TAG:?}
    # Le rôle en lecture seule, par les variables de libpq que `pg_dump`, `psql` et la sonde
    # lisent ; la clé publique `age` ; le bucket des sauvegardes et son jeton ; l'adresse de ping.
    # Rien de plus : ni le mot de passe de l'application, ni `SECRET_KEY`, ni le jeton du Tunnel
    # (`apps/api/tests/test_compose.py`).
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?}
      PGUSER: ${BACKUP_POSTGRES_USER:?}
      PGPASSWORD: ${BACKUP_POSTGRES_PASSWORD:?}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?}
      BACKUP_R2_ENDPOINT: ${BACKUP_R2_ENDPOINT:?}
      BACKUP_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:?}
      BACKUP_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:?}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:?}
      BACKUP_PING_URL: ${BACKUP_PING_URL:?}
    depends_on:
      postgres:
        condition: service_healthy
    # Les fichiers de travail de la chaîne — le dump en clair — en mémoire : un `tmpfs`, ni volume
    # ni couche du conteneur, que l'arrêt du conteneur vide. `docker stop` tue une sauvegarde en
    # cours sans qu'aucun piège du script ne joue (mesuré à la relecture de la PR #73). Borné : le
    # dump et sa version chiffrée y tiennent ensemble, sur un VPS de 2 Go (ADR 0023) ; au-delà,
    # l'écriture échoue, l'étape est nommée et aucun ping ne part — sans borne, la moitié de la
    # RAM, au détriment de Postgres.
    tmpfs: ["/tmp:size=512m"]
    # Sain quand son rôle ouvre une session sur la base. Rien hors du réseau du projet : une panne
    # de R2 ou de healthchecks.io ne rougit pas un déploiement — c'est l'absence de ping qui la dit.
    healthcheck:
      <<: *probe-timing
      test: [CMD, psql, --no-psqlrc, --quiet, --command, SELECT 1]
    restart: unless-stopped

volumes:
  postgres-data:
