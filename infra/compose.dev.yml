# Environnement de développement complet : Postgres, Redis, `api` et `worker` sur un réseau privé
# (cadrage §6.7, « développement local complet en Docker Compose »). Le Compose de production
# est `compose.yml`, aux mêmes images (ADR 0012) ; ce fichier ne sert jamais ailleurs que sur un
# poste. Le `worker` partage l'image d'`api`, avec une autre commande (ADR 0015).
#
# **Deux fichiers d'environnement, deux rôles distincts** :
#   - `../.env` — non commité, copié de `.env.example` — est celui que lit `Env`. Compose
#     l'injecte tel quel dans l'environnement des conteneurs `api` et `worker` (`env_file`). Il
#     est orienté poste : ses adresses visent `127.0.0.1`.
#   - `dev.env` — commité — porte ce que Compose seul connaît. Il n'est **pas** dans `env_file` :
#     il alimente l'interpolation `${...}` ci-dessous, ce que Compose ne fait qu'avec le fichier
#     passé en `--env-file`. Mesuré : sans ce drapeau, `${POSTGRES_USER}` est vide ici même.
#     C'est pourquoi la pile se démarre par `make dev` et pas par un `docker compose` nu.
#
# Aucune valeur n'est écrite en dur : `environment:` prime sur `env_file:`, et c'est ce qui
# permet de remplacer les adresses du poste par les noms de service sans toucher à `.env`.

# Nom de projet explicite : sans lui, Compose le tire du dossier du fichier — les conteneurs
# s'appelleraient « infra-… », et deux dépôts nommés `infra` se marcheraient dessus.
name: portfolio-dev

services:
  postgres:
    # Les images tierces sont épinglées comme les images de base, étiquette précise et empreinte,
    # et Dependabot les tient à jour (`.github/dependabot.yml`). Debian 13 (`trixie`) : la 12 est
    # sortie du support de sécurité régulier (ADR 0014), et changer de bibliothèque C avant toute
    # donnée de production évite d'en réindexer une pour l'ordre de tri (brief de #16, décision 5).
    image: pgvector/pgvector:0.8.7-pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Lié à `127.0.0.1` et non à toutes les interfaces : sur un réseau partagé, un port de
      # base de données publié sans adresse est joignable par la machine d'à côté.
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `api` joue les migrations dès son démarrage : sans cette sonde, il démarrerait pendant
      # l'initialisation de Postgres et échouerait au premier `up` d'un clone neuf.
      #
      # `-h 127.0.0.1` n'est pas décoratif. Sans hôte, `pg_isready` interroge le socket Unix —
      # or le serveur temporaire d'`initdb` tourne avec `listen_addresses=''` : il accepte déjà
      # le socket et refuse encore TCP. Mesuré dans cet état : la sonde sans hôte rend
      # « accepting connections » (0) quand la même avec `-h 127.0.0.1` rend « no response » (2).
      # La sonde doit mesurer ce dont `api` dépend — le réseau — pas ce qui est prêt en premier.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    # Sans cette ligne, Compose fabrique son propre nom (`portfolio-dev-api`) et l'on obtient
    # deux images du même Dockerfile — celle de `make build` et celle de `make dev`. Le
    # `Makefile` exporte le préfixe des images, `IMAGE_PREFIX` ; le défaut ci-dessous ne sert
    # qu'à un `docker compose` lancé à la main, et un test vérifie qu'il n'a pas dérivé de celui
    # du `Makefile`.
    image: ${IMAGE_PREFIX:-portfolio-}api
    build:
      # Contexte à la racine du dépôt : l'espace de travail `uv` et son verrou y vivent.
      context: ..
      dockerfile: infra/api/Dockerfile
    env_file: ../.env
    # Ancrés pour que le `worker` les reprenne tels quels (brief de #12, décision 10).
    environment: &app-environment
      # Les adresses du poste (`127.0.0.1`) ne valent rien depuis le conteneur : elles sont
      # recomposées avec les noms de service. `environment:` prime sur `env_file:`.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # Le volume, pas un dossier du dépôt : un chemin d'hôte n'aurait aucun sens ici.
      MEDIA_ROOT: /app/media
    # Remplace le `gunicorn` de l'image (ADR 0001), qui reste sa commande de production. Le
    # rechargement à chaud vient du serveur de développement de Django, pas d'un réglage d'image.
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "127.0.0.1:${API_PORT}:8000"
    volumes: &app-volumes
      # Le code de l'hôte recouvre celui de l'image : le membre est installé en mode éditable,
      # donc l'environnement y renvoie et `runserver` voit les modifications.
      - ../apps/api:/app/apps/api
      - media:/app/media
    depends_on: &data-services
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Le worker d'images (ADR 0015) : l'image d'`api` et une autre commande. Sans `build:` : `api` la
  # construit, et `up --build` démarre le `worker` sur l'image construite — l'échec du pull de son
  # nom, que Compose tente d'abord, ne bloque rien (mesuré sur Compose 5.0.2, image absente).
  # Mêmes variables et mêmes volumes : il lit l'original et écrit les variantes sur le stockage
  # d'`api`. Il ne recharge pas le code modifié : `docker compose restart worker`.
  worker:
    image: ${IMAGE_PREFIX:-portfolio-}api
    env_file: ../.env
    environment:
      <<: *app-environment
      # Vide : le point d'entrée ne joue aucune étape — c'est `api` qui migre (`entrypoint.sh`).
      STARTUP_STEPS: ""
    # Un seul processus de traitement (décision 9).
    command: [celery, -A, config, worker, --loglevel, info, --concurrency, "1"]
    volumes: *app-volumes
    depends_on: *data-services

volumes:
  postgres-data:
  media:
