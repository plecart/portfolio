<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icônes du site : ordre et `sizes`, docs/frontend-outillage.md §2.4. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Mode forcé posé avant le premier rendu : script classique et bloquant, servi en fichier
         par un chemin absolu — docs/frontend-outillage.md §2.4. -->
    <script src="/theme.js"></script>

    <!-- Paires marquées du gabarit — meta, page, root — et identité du site : contrat et valeurs
         par défaut dans docs/frontend-outillage.md §2.4. Ce fichier part chez chaque visiteur —
         l'explication longue vit dans la doc, pas ici. -->
    <!--meta:start-->
    <title>Pacôme Bernier</title>
    <meta
      name="description"
      content="Pacôme Bernier, ingénieur IA en Île-de-France : conception, développement, données et exploitation d’applications web, présentées ici projet par projet."
    />
    <meta property="og:title" content="Pacôme Bernier" />
    <meta
      property="og:description"
      content="Pacôme Bernier, ingénieur IA en Île-de-France : conception, développement, données et exploitation d’applications web, présentées ici projet par projet."
    />
    <!--meta:end-->
    <!--page:start-->
    <link rel="canonical" href="https://pacome.dev/" />
    <!--page:end-->

    <!-- Identité du site, sur chaque page, relue par Django : docs/frontend-outillage.md §2.4. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://pacome.dev/#person",
            "name": "Pacôme Bernier",
            "url": "https://pacome.dev/",
            "sameAs": ["https://github.com/plecart", "https://www.linkedin.com/in/pacomebernier98/"]
          },
          {
            "@type": "WebSite",
            "url": "https://pacome.dev/",
            "name": "Pacôme Bernier",
            "inLanguage": "fr"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"><!--root:start--><!--root:end--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
