<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Emplacement marqué du gabarit (ADR 0008, « Aperçus de lien »).

      La CI copie l'`index.html` compilé dans l'image `api` ; sur `/projets/<slug>`, une vue
      Django remplace **tout le bloc** entre les deux marqueurs par les balises du projet (#14).
      Les deux marqueurs sont donc un contrat : ils doivent rester uniques dans le fichier
      compilé, et un test de bout en bout le vérifie sur la version servie, pas sur la source.

      Les valeurs ci-dessous sont celles du site. Servies telles quelles à un robot d'aperçu,
      elles restent correctes : c'est le comportement attendu pour toute adresse hors
      `/projets/<slug>`, et pour un slug inconnu (ADR 0008 : « gabarit sans balises projet »).

      `og:image` n'a volontairement pas de valeur par défaut : partout où la documentation le
      nomme, c'est la **couverture du projet** (spec §1.11 et §7, ADR 0008), et il n'existe pas
      d'image de site. #14 l'injecte avec les autres ; une image d'ouverture propre au site
      viendra avec la direction visuelle (#18) si elle est voulue.

      `description` accompagne `og:description` et porte le même texte : le résumé du projet
      pour une fiche (spec §1.17), celui du site partout ailleurs.
    -->
    <!--meta:start-->
    <title>Pacôme Bernier</title>
    <meta
      name="description"
      content="Portfolio de Pacôme Bernier : projets de conception, développement, données et exploitation."
    />
    <meta property="og:title" content="Pacôme Bernier" />
    <meta
      property="og:description"
      content="Portfolio de Pacôme Bernier : projets de conception, développement, données et exploitation."
    />
    <!--meta:end-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
