<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icônes du site : ordre et `sizes`, docs/frontend-outillage.md §2.4. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Mode forcé posé avant le premier rendu : script classique et bloquant, servi en fichier
         par un chemin absolu — docs/frontend-outillage.md §2.4. -->
    <script src="/theme.js"></script>

    <!-- Emplacement marqué du gabarit : #14 remplace tout le bloc entre les deux marqueurs.
         Contrat, valeurs par défaut et absence d'`og:image` : ADR 0008 « Aperçus de lien » et
         docs/frontend-outillage.md §2.4. Ce fichier part chez chaque visiteur — l'explication
         longue vit dans la doc, pas ici. -->
    <!--meta:start-->
    <title>Pacôme Bernier</title>
    <meta
      name="description"
      content="Portfolio de Pacôme Bernier : projets de conception, développement, données et exploitation."
    />
    <meta property="og:title" content="Pacôme Bernier" />
    <meta
      property="og:description"
      content="Portfolio de Pacôme Bernier : projets de conception, développement, données et exploitation."
    />
    <!--meta:end-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
