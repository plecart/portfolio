# Application Django : contenu, admin et API (ADR 0001). Elle se lance depuis son dossier
# (`manage.py`), mais reste installable pour que `config` s'importe depuis la racine — c'est ce
# qui rend `pytest` et `pyright` utilisables sans chemin d'import bricolé.
[project]
name = "api"
version = "0"
requires-python = ">=3.12"
# `gunicorn` et `psycopg` ne sont importés par aucun module du dépôt, et ce n'est pas un oubli :
# le premier est la commande par défaut de l'image (ADR 0001), le second est chargé par Django à
# sa première connexion — les migrations, au démarrage du conteneur. `STARTUP_IMPORTS`
# (`tests/test_django_project.py`) les tient sous test : c'est ce qui les distingue de
# dépendances mortes.
#
# `psycopg[binary]` plutôt que `[c]` : option recommandée par la documentation, et la seule qui
# n'exige ni `libpq` ni outils de build — donc aucun étage de compilation dans l'image.
#
# `markdown-it-py` et `nh3` ne servent qu'à l'aperçu Markdown de l'admin (ADR 0010) :
# `content/preview.py` est le seul module qui les importe, ce que `tests/test_markdown_preview.py`
# tient.
#
# `pillow` lit les images téléversées dans l'admin : `ImageField` l'exige (doc Django), et
# `content/images.py` est le seul module de l'application, tests exclus, qui l'importe, ce que
# `tests/test_images.py` tient. Le plancher n'est pas décoratif :
# quatre avis de gravité haute, publiés le 2026-07-20, ne sont corrigés qu'en 12.3.0 (brief de #9,
# décision 12).
#
# `django-ninja` porte l'API publique (ADR 0001) : `content/api.py` et `content/schemas.py` sont
# les seuls modules qui l'importent, ce que `tests/test_api.py` tient.
#
# `django-otp` porte le second facteur de l'admin (#6) : `OTPAdminSite`, dont hérite le site par
# défaut (`access/site.py`, gabarit de connexion recopié et épinglé), son middleware, et les deux
# appareils, TOTP et codes de secours. Sans l'extra `qrcode` : l'URI `otpauth://` qu'imprime
# `enroll_second_factor` suffit à l'application TOTP. Le paquet n'est pas typé — ni `py.typed` en
# 1.7.5, ni `types-django-otp` ou `django-otp-stubs` sur PyPI (2026-10-28) : chacun de ses imports
# porte `# pyright: ignore[reportMissingTypeStubs]`, plutôt qu'un réglage de `[tool.pyright]` qui
# éteindrait la règle pour tous.
#
# `django-cors-headers` restreint CORS à l'origine du site (ADR 0008). Aucun module ne l'importe :
# Django le charge par `INSTALLED_APPS` et `MIDDLEWARE`, et les tests de CORS de `tests/test_api.py`
# l'atteignent par la route.
#
# `django-storages[s3]` porte le stockage des fichiers téléversés sur Cloudflare R2, en production
# (ADR 0004) ; l'extra installe `boto3`, qui parle l'API S3 de R2. Aucun module ne l'importe :
# Django le charge par `STORAGES` (`config/storage.py`) quand `MEDIA_STORAGE` vaut `r2`, et
# `tests/test_storage.py` l'atteint par `create_storage`.
#
# `celery[redis]` porte le worker d'images, broker Redis, sans backend de résultats (ADR 0015) ;
# `config/celery.py` en construit l'application. L'extra installe le client `redis`, que kombu
# charge seul, au premier usage du transport — un enfilement, même synchrone ; `STARTUP_IMPORTS`
# (`tests/test_django_project.py`) le tient. kombu 5.6.2 le borne sous 6.5.
#
# `django-redis` porte le cache du contenu, sur le Redis du broker (ADR 0006, rôle 1 ; #11). Aucun
# module ne l'importe : Django le charge par `CACHES` (`config/settings.py`), et
# `tests/test_cache.py` l'atteint par ses tests de Redis injoignable — le reste de la suite tourne
# sur le cache en mémoire que pose le harnais. 7.0.0 admet Django jusqu'à 7.0 exclu, mais ses
# classificateurs s'arrêtent à 6.0 (PyPI, 2026-11-03) : c'est la suite qui l'éprouve sur la 6.1.
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=6.0",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.7.1",
    "django-otp>=1.7.5",
    "django-redis>=7.0.0",
    "django-storages[s3]>=1.14.6",
    "django-stubs-ext>=6.1.1",
    "gunicorn>=23",
    "markdown-it-py>=4.2.0",
    "nh3>=0.3.7",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2",
    "whitenoise>=6.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["access", "config", "content"]
