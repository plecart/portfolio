# La fusion explicite du trunk (issue #249). Sur une PR, chaque job qui extrait le dépôt fusionne
# lui-même la tête de la PR au trunk courant, au lieu d'extraire `refs/pull/<n>/merge` : la forge
# calcule cette référence à l'événement et ne la recalcule pas quand le trunk avance, et un
# `gh run rerun` réutilise le même commit. Ici, une relance refait la fusion sur le trunk du moment.
#
# Le commit obtenu a le trunk en premier parent et la tête en second : `HEAD^1..HEAD` reste le
# delta de la PR (étape `jobs` du job `api`, ADR 0017), `HEAD^1..HEAD^2` ses commits (job
# `auteurs`).
#
# Le checkout extrait d'abord la tête, clone complet (`ref` et `fetch-depth: 0` dans `ci.yml` et
# `avis.yml`) : une action locale se lit dans l'arbre extrait, et extraire le trunk d'abord ferait
# tourner la version du trunk de cette action, pas celle de la PR. Le pas change ensuite l'arbre
# sous lui sans se changer : le runner copie son script dans un fichier temporaire avant de le
# lancer (doc GitHub « Workflow syntax », `shell` et « Custom shell » ; « Metadata syntax »,
# `runs.steps[*].shell` ; lues le 2026-11-08).
#
# Sur un push vers `main`, le pas ne joue pas : le checkout a pris le commit poussé.
name: Fusion explicite du trunk
description: Sur une PR, fusionne la tête extraite au trunk courant, le trunk en premier parent.

runs:
  using: composite
  steps:
    # Le trunk est la branche que la PR vise — une PR de lot vise la branche d'intégration de son
    # issue —, lue dans `refs/remotes/origin/`, que le clone complet écrit pour chaque branche
    # (`getRefSpecForAllHistory` d'`actions/checkout`, lu le 2026-11-08). Branche et tête passent
    # par l'environnement, jamais développées dans le script.
    #
    # Le runner n'a pas d'identité git : le commit prend celle du robot d'Actions. `--quiet` : le
    # résumé de la fusion, un nom de fichier par ligne, ne s'écrit pas — un fichier nommé comme la
    # trace l'imiterait ; un conflit s'écrit quand même. La trace, en dernier, relit les parents du
    # commit : une ligne destinée à `porte-merge.py trunk`, et aucune ligne du script, que le
    # journal recopie, ne commence par son préfixe — celle qui l'écrit commence par `printf`.
    - if: github.event_name == 'pull_request'
      shell: bash
      env:
        TRUNK: ${{ github.event.pull_request.base.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        git checkout --quiet --detach "refs/remotes/origin/$TRUNK"
        trunk=$(git rev-parse HEAD)
        if ! git -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' merge --no-ff --quiet -m "Merge $HEAD_SHA into $trunk" "$HEAD_SHA"; then
          echo "::error::La tête $HEAD_SHA ne se fusionne pas sans conflit dans origin/$TRUNK ($trunk). Fichiers en conflit : $(git diff --name-only --diff-filter=U | paste -sd ' ' -)"
          exit 1
        fi
        printf 'Fusion explicite : %s Merge %s into %s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^2)" "$(git rev-parse HEAD^1)"
