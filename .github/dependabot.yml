# Mises à jour des dépendances par Dependabot (cadrage §6.6 « chaîne d'approvisionnement » ;
# brief de #5). Une entrée par écosystème — par dossier d'image pour `docker` —, toutes sur la
# même politique :
#
# - passage hebdomadaire ;
# - versions mineures et correctifs groupés en une PR par entrée ; chaque montée majeure a
#   sa PR à elle — elle casse plus souvent, et mêlée au lot elle bloquerait tout le reste —,
#   sauf celles qu'une entrée refuse (`ignore`, raison en commentaire) ;
# - aucun libellé (`labels: []`) : sans cette ligne, Dependabot crée `dependencies`, `python`…,
#   hors du mapping de `.claude/pipeline.config.md`. Les PR du bot sont exemptées des
#   métadonnées de PR (même fichier, « Métadonnées d'une PR ») ;
# - commits `chore(deps): …` ou `chore(deps-dev): …` : le préfixe conventional du dépôt. La
#   description reste en anglais, Dependabot ne sait pas l'écrire autrement.
#
# Une PR du bot se merge comme toute autre : CI verte et go humain, jamais d'auto-merge.
# `apps/api/tests/test_supply_chain.py` tient la politique égale d'une entrée à l'autre — pas
# d'ancre YAML, dont la documentation de Dependabot ne dit rien.

version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: []
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: []
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Montées majeures refusées tant qu'un plugin qu'on garde ne les déclare pas comme pair
      # (docs/frontend-outillage.md §2.4). Ces règles-ci ont chacune leur entrée dans
      # `apps/web/dependency-refusals.json`, et un test rougit le jour où sa raison tombe : elle se
      # retire alors, sans quoi, relative à la version en place, elle refuserait aussi la majeure
      # suivante. Une mise à jour de sécurité passe outre un `update-types`.
      #
      # ESLint 10 : `eslint-plugin-jsx-a11y` déclare `eslint@^3 || … || ^9`, `npm ci` échouerait
      # en `ERESOLVE`. `@eslint/js` 10 va par paire avec lui : seule, elle passe `npm ci`, mais
      # déclare `eslint ^10` en pair optionnel et `npm install` échoue.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      # TypeScript 7 : `typescript-eslint` déclare `typescript >=4.8.4 <6.1.0`, `npm ci` échouerait
      # en `ERESOLVE`.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Hors table, et permanent : `@types/node` suit la majeure de Node (`apps/web/.nvmrc`), que le
      # projet change à la main — des types plus récents décriraient des API absentes du runtime.
      # `apps/web/tests/configuration.test.ts` exige les deux majeures égales.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # Les empreintes de `.github/workflows/*.yml` et leur commentaire de version, mis à jour
  # ensemble.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: []
    commit-message:
      prefix: chore
      include: scope

  # Les images de base des images du dépôt, épinglées par étiquette précise et par empreinte :
  # chaque nouvelle version de correctif (Python 3.12.x, `uv`, Caddy, Alpine, Go) arrive en
  # PR, étiquette et empreinte ensemble. La reconstruction d'une même étiquette peut ne pas être
  # proposée (expérience `docker_digest_only_update_suppression` de Dependabot) : le scan des images
  # (#15) la couvre. Un dossier par image (ADR 0014), et une entrée par dossier : tant qu'une PR de
  # groupe est ouverte, Dependabot n'examine plus aucun dossier de son entrée — une PR sur l'image
  # `api` a caché Caddy 2.11.7, sur Docker Hub depuis le 2026-10-06 (#125). Un test exige que chaque
  # Dockerfile ait la sienne, et que toutes suivent la politique commune.
  - package-ecosystem: docker
    directory: /infra/api
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: []
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Changer de version de Python est une décision du projet (`.python-version`, que l'image
      # suit sous test), pas une mise à jour : une PR `3.13.x-slim-trixie` échouerait par
      # construction, chaque semaine. Les correctifs de la 3.12 passent.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: docker
    directory: /infra/backup
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: []
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /infra/caddy
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: []
    commit-message:
      prefix: chore
      include: scope

  # Les images tierces des fichiers Compose — Postgres, Redis, `cloudflared` —, épinglées comme les
  # images de base, et à la même épingle dans les deux fichiers (ADR 0012). Dependabot lit dans
  # `/infra` tout fichier dont le nom contient `compose….yml`, et saute les images du dépôt, que
  # nomme une variable ; il ne propose qu'une étiquette de même suffixe (`-pg16-trixie`, `-alpine`) :
  # ni un autre Postgres, ni une autre variante d'image comme `-alpine3.22` (dependabot-core,
  # `docker/tag.rb`). Un test exige que chaque fichier Compose qui cite une image tierce soit lu ici.
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: []
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Redis 7 est une décision du projet (ADR 0006), pas une mise à jour. Les correctifs passent.
      - dependency-name: redis
        update-types: [version-update:semver-major]
