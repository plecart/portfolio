# CI générée par `init-projet` depuis la section « Commandes du projet » de
# .claude/pipeline.config.md, régénérée au scaffold du front (#3).
#
# Chaque étape appelle une cible du `Makefile` : la CI et le poste de développement exécutent
# la même commande, jamais deux définitions parallèles.
#
# Aucune version de runtime n'apparaît ici : `.python-version` et `apps/web/.nvmrc` les épinglent,
# et les actions de mise en place les lisent. Un second canal qui déclarerait une version
# finirait par diverger du premier.
#
# Le dépôt est public : les minutes ne coûtent rien, et chaque vérification part dès qu'elle peut
# (ADR 0032).
#
# Un premier job, `changes`, lit le delta par `infra/ci/changed_jobs.py` : celui d'une PR prête,
# celui d'un push vers `main`, ou l'arbre entier du commit d'une release, qu'il refuse si ce commit
# n'est pas sur `main` (ADR 0033). Les vérifications l'attendent, lui seul, et partent ensemble,
# chacune si le delta touche ses fichiers (ADR 0017) : `api` toujours — lint, types et tests du
# back, ceux de la pipeline selon le delta, et le refus d'un commit d'auteur Claude ; `web` — lint,
# tests, build, e2e du projet `desktop`, Lighthouse ; `mobile` — e2e du projet `mobile`, sur la
# sortie de `web` ; `infra` — configuration Compose, images et leurs tests ; `avis` — les portes à
# base d'avis, audit Python, audit npm et scan des images, en appelant `avis.yml`, sur une PR
# seulement.
# Un job par pile : elles n'ont pas les mêmes prérequis — `uv`, Node, Docker —, et un rouge du front
# ne masque pas un rouge de l'infra, ni l'inverse. Le job `infra` installe aussi Node : les images
# copient le front compilé, qu'il compile lui-même plutôt que d'attendre `web` (ADR 0014) ; et
# `uv`, pour les tests des images qu'il vient de construire.
#
# Un push vers `main` rejoue ces vérifications sur le commit mergé, et rien d'autre : la mise en
# production part de la publication d'une release, pas d'un merge (ADR 0033). Sur une release
# publiée, hors prerelease, elles rejouent le commit de son tag pendant que `publish` compile le
# front, construit les images, les scanne et les publie sur GHCR ; `fumee` démarre la pile de
# production depuis ces images et la fait éprouver par Playwright ; `deploy` ne les déploie sur le
# VPS, une fois celui-ci prêt, qu'après une fumée verte, un `api` vert, et `web`, `mobile` et
# `infra` verts ou sautés — et seulement si la release est la dernière publiée.
# `avis` n'y tourne pas : `publish` scanne avant de pousser, et `avis.yml` rejoue ses portes chaque
# jour sur `main`.
#
# Sur une PR, chaque job qui extrait le dépôt en extrait la tête, clone complet, puis la fusionne
# lui-même au trunk courant (le pas « Fusion explicite du trunk » du job `changes`, qui dit
# pourquoi) : le trunk en premier parent, la tête en second. Sur un push vers `main`, le checkout
# prend le commit poussé, sur une release le commit de son tag, et rien ne se fusionne.
#
# Chaque action est épinglée par **empreinte de commit**, sa version en commentaire : une
# étiquette peut être déplacée par son propriétaire ou par un attaquant, et le déplacement
# s'exécuterait ici sans aucun signal ; une empreinte ne bouge pas. Dependabot
# (`.github/dependabot.yml`) les met à jour chaque mois, empreinte et commentaire ensemble. Le
# commentaire porte l'étiquette la plus précise du commit (`v7.0.1`, pas `v7`) : Dependabot ne
# réécrit qu'un commentaire dont l'étiquette pointe encore sur le commit épinglé, et une étiquette
# majeure cesse d'y pointer dès qu'une version sort — précisément quand la mise à jour arrive.
# `apps/api/tests/test_supply_chain.py` refuse toute autre forme.

name: CI

# Aucune étape n'écrit sur le dépôt : le jeton ne reçoit que la lecture. Le défaut d'un dépôt
# peut être bien plus large, et il ne se resserre pas tout seul quand un workflow n'en a pas
# besoin. Seul le job `publish` reçoit en plus l'écriture des paquets, pour pousser les images et
# supprimer leurs anciennes versions — dans le registre, jamais sur le dépôt ; le job `fumee`, leur
# lecture, pour tirer les images qu'il éprouve.
permissions:
  contents: read

on:
  pull_request:
    # `ready_for_review` produit le premier run d'une PR : le garde `if:` du job `changes` saute
    # toute draft, et aucun run n'a donc couvert son SHA (ADR 0019). `cycle-pr` sort du draft, puis
    # attend ce run (Étape 5) ; chaque push en lance un autre ; `reopened` relance une PR dont
    # l'événement s'est perdu, ou dont le trunk a changé la définition du workflow depuis le
    # déclenchement : seul un événement neuf la relit (ADR 0029).
    types: [opened, synchronize, reopened, ready_for_review]
  # Rejoue les vérifications du commit mergé, sans rien publier (ADR 0032, ADR 0033).
  push:
    branches: [main]
  # La publication d'une release, et elle seule, met en production le commit de son tag
  # (ADR 0033). Seul `published` est écouté : un brouillon ne lance rien, et l'édition d'une release
  # publiée ne la redéploie pas ; une prerelease publiée lance le run, et le garde des jobs de
  # livraison la saute (doc GitHub « Events that trigger workflows », `release`, lue le 2026-11-28).
  release:
    types: [published]

# Un run par PR, le plus récent : un push qui en suit un autre annule le run encore en cours de la
# même PR, qui ne vérifiait plus la tête. Mesuré du 2026-10-04 au 2026-10-17 : 70 runs de PR suivis
# d'un autre run de la même branche en moins de 5 minutes (#124). Sur un push vers `main` ou une
# release, `github.event.pull_request` est vide : le groupe se replie sur le SHA, propre à chaque
# commit, et rien ne s'annule — le run de `main` vérifie le commit mergé, celui d'une release le met
# en production. L'événement préfixe le groupe : le run d'une release n'attend pas celui du push de
# son commit (ADR 0033). Les groupes des jobs `publish` et `deploy` s'ajoutent à celui-ci.
# `apps/api/tests/test_ci_declencheurs.py` tient ces réglages.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Delta — jobs à lancer
    runs-on: ubuntu-latest

    # Une PR prête, un push vers `main` ou une release publiée. Aucune draft ne tourne, quel que
    # soit l'événement — ouverture, push, réouverture : une draft change à chaque commit, et un run
    # ne vaut que là où son verdict peut tenir — au passage en ready, puis à chaque push
    # (ADR 0019). Un rouge propre à la plateforme cible se voit donc au passage en ready, après la
    # relecture (`cycle-pr`, Étape 4) : le prix assumé. Une PR ouverte prête — un bot de
    # dépendances, une branche déjà écrite — tourne dès l'ouverture. Un push vers `main` tourne : il
    # rejoue les vérifications du commit mergé (ADR 0032). Une release tourne : elle rejoue toutes
    # les vérifications sur le commit de son tag, avant de le mettre en production (ADR 0033).
    #
    # Les clauses `push` et `release` sont écrites : seule, la comparaison de `draft` serait vraie
    # aussi sur l'un et l'autre, où l'objet `pull_request` manque — GitHub compare son `draft`, nul,
    # à `false` en nombres, 0 contre 0 (doc « Expressions », « Operators », lue le 2026-11-21) —,
    # par une coercion qu'aucun lecteur n'attend. Les vérifications ne portent pas ce garde : elles
    # attendent ce job, et un job sauté saute ceux qui l'attendent (doc « Workflow syntax »,
    # `jobs.<job_id>.needs`, lue le 2026-11-24).
    if: >-
      github.event_name == 'push' || github.event_name == 'release'
      || github.event.pull_request.draft == false

    # Ce que le delta concerne, lu par les vérifications : `web` par `web` et `mobile`, `infra` et
    # `avis` par leur job, `pipeline` par l'étape « Tests pipeline » d'`api`.
    outputs:
      web: ${{ steps.jobs.outputs.web }}
      infra: ${{ steps.jobs.outputs.infra }}
      avis: ${{ steps.jobs.outputs.avis }}
      pipeline: ${{ steps.jobs.outputs.pipeline }}

    steps:
      # La tête de la PR, que le pas suivant fusionne au trunk courant : `HEAD^1` est le trunk qu'il
      # combine, et `HEAD^1..HEAD` le delta de la PR. Sur un push ou une release, `ref` est vide :
      # le commit poussé ou celui du tag, et le clone complet porte aussi la base du push et
      # `refs/remotes/origin/main`, que lit le pas « Tag issu de main ». Écrit ici sous l'ancre
      # `extraction`, que les autres jobs de vérification reprennent par `*extraction`, comme le pas
      # suivant.
      - &extraction
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # La fusion explicite du trunk (ADR 0029), écrite ici en entier sous l'ancre `fusion`, que
      # les autres jobs reprennent par `*fusion` (doc GitHub « Reusing workflow configurations ») ;
      # `avis.yml` en porte une copie, une ancre ne valant que dans son fichier, et
      # `apps/api/tests/test_ci_declencheurs.py` les tient égales. Elle vit dans la définition du
      # workflow, que le run lit à son commit, jamais dans l'arbre extrait : une action locale se
      # lirait dans la tête, qu'une PR ouverte avant elle ne porte pas.
      #
      # Le trunk est la branche que la PR vise — une PR de lot vise la branche d'intégration de son
      # issue —, lue dans `refs/remotes/origin/`, que le clone complet écrit pour chaque branche
      # (`getRefSpecForAllHistory` d'`actions/checkout`, lu le 2026-11-08). Branche et tête passent
      # par l'environnement, jamais développées dans le script.
      #
      # Le runner n'a pas d'identité git : le commit prend celle du robot d'Actions. `--quiet` : le
      # résumé de la fusion, un nom de fichier par ligne, ne s'écrit pas — un fichier nommé comme la
      # trace l'imiterait ; un conflit s'écrit quand même. Une tête que le trunk contient déjà ne
      # construit rien, et `merge` sort pourtant en 0 : le pas échoue plutôt que de donner un commit
      # du trunk pour une fusion. La trace, en dernier, relit les parents du commit et nomme le
      # `GITHUB_SHA` du run, la référence de fusion dont il a lu cette définition, qu'un
      # `gh run rerun` garde : une ligne destinée à `porte-merge.py trunk`, et aucune ligne du
      # script, que le journal recopie, ne commence par son préfixe — celle qui l'écrit commence
      # par `printf`.
      - &fusion
        name: Fusion explicite du trunk
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          TRUNK: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout --quiet --detach "refs/remotes/origin/$TRUNK"
          trunk=$(git rev-parse HEAD)
          if ! git -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' merge --no-ff --quiet -m "Merge $HEAD_SHA into $trunk" "$HEAD_SHA"; then
            echo "::error::La tête $HEAD_SHA ne se fusionne pas sans conflit dans origin/$TRUNK ($trunk). Fichiers en conflit : $(git diff --name-only --diff-filter=U | paste -sd ' ' -)"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "$trunk" ]; then
            echo "::error::La tête $HEAD_SHA est déjà dans origin/$TRUNK ($trunk) : rien à fusionner."
            exit 1
          fi
          printf 'Fusion explicite : %s Merge %s into %s (workflow %s)\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^2)" "$(git rev-parse HEAD^1)" "$GITHUB_SHA"

      # Sur une release, le commit du tag doit être sur `main` (ADR 0033) : rouge, ce job saute les
      # vérifications et `publish`, qui l'attendent — rien ne se publie ni ne se déploie. Le clone
      # complet écrit `refs/remotes/origin/main` : `fetch-depth: 0` « fetch all history for all
      # branches and tags », par `+refs/heads/*:refs/remotes/origin/*` (README et
      # `getRefSpecForAllHistory` d'`actions/checkout` v7.0.1, lus le 2026-11-28). La référence est
      # écrite en entier : `origin/main` nu se lirait d'abord un tag de ce nom (doc git
      # « gitrevisions »). Un `merge-base` en erreur échoue fermé, comme un commit hors de `main`.
      - name: Tag issu de main
        if: github.event_name == 'release'
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Le commit $GITHUB_SHA du tag $GITHUB_REF_NAME n'est pas sur main : la release ne se publie pas."
            exit 1
          fi

      # Le delta, passé au script, où vit la règle (ADR 0017). Sa base : sur une PR, `HEAD^1`, le
      # trunk que le pas de fusion a combiné ; sur un push, `github.event.before` — un merge par
      # rebase pousse plusieurs commits d'un coup, et le dernier seul en cacherait (ADR 0032) ; sur
      # une release, l'arbre vide, que git connaît sans l'avoir stocké : le delta est l'arbre entier
      # du commit, et chaque vérification le rejoue — `avis` excepté, gardé sur une PR (ADR 0033).
      # Chaque `&&` se lit avant les `||` qui l'entourent (`expressions/src/parser.ts`
      # d'`actions/languageservices`, lu le 2026-11-28). La base passe par l'environnement, jamais
      # développée dans le script. `shell: bash` lance `bash -eo pipefail` : sans lui, un
      # `git diff` en échec rendrait `false` pour chaque job, en silence. `--no-renames` : un
      # renommage s'écrit sous ses deux chemins — sans lui, un fichier déplacé du front vers
      # `docs/` ne laisserait que `docs/…`, et `web` sauterait.
      - name: Jobs à lancer
        id: jobs
        shell: bash
        env:
          BASE: >-
            ${{ github.event_name == 'release' && '4b825dc642cb6eb9a060e54bf8d69288fbee4904'
            || github.event_name == 'push' && github.event.before || 'HEAD^1' }}
        run: git diff --name-only --no-renames "$BASE" HEAD | python3 infra/ci/changed_jobs.py >> "$GITHUB_OUTPUT"

  api:
    name: Back — lint, format, types, tests
    runs-on: ubuntu-latest

    # Après `changes`, sans garde propre : un `changes` sauté — une draft — le saute. Il tourne sur
    # chaque PR prête, chaque push vers `main` et chaque release, quel que soit le delta (ADR 0032,
    # ADR 0033). `apps/api/tests/test_ci_declencheurs.py` tient ces réglages.
    needs: changes

    steps:
      - *extraction

      - *fusion

      # Aucun commit de la PR d'auteur Claude : six ont atteint `main` et son panneau des
      # contributeurs, et un hook local ne couvre pas une session cloud — ce contrôle vaut pour toute
      # PR, d'où que viennent ses commits. Le pas de fusion a combiné la tête de la PR (`HEAD^2`) au
      # trunk courant (`HEAD^1`) : `HEAD^1..HEAD^2` lit ses commits. Sur une PR seulement : un push
      # vers `main` ou une release n'a rien fusionné, et ses commits ont passé ce pas sur leur PR —
      # ceux d'une release sont sur `main`, ou le pas « Tag issu de main » la refuse. Un pas et non
      # un job : rien à gagner à en faire un (ADR 0032) ; rouge, il rougit `api`, et le push qui
      # corrige l'auteur relance le run.
      - name: Refuser un auteur Claude
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          commits=$(git log --no-mailmap -i -F --author='<noreply@anthropic.com>' --format='%h %s' HEAD^1..HEAD^2)
          if [ -n "$commits" ]; then echo "$commits"; exit 1; fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: make install

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Typecheck
        run: make typecheck

      - name: Tests
        run: make test

      # Les tests de la pipeline (`.claude/tests`) : seulement si le delta la concerne — la sortie
      # `pipeline` du job `changes` (ADR 0025, ADR 0032). Une étape et non un job : elle reprend
      # l'installation de ce job.
      - name: Tests pipeline
        if: needs.changes.outputs.pipeline == 'true'
        run: make test-pipeline

  web:
    name: Front — lint, types, tests, build, e2e, lighthouse
    runs-on: ubuntu-latest

    # Après `changes`, et seulement si le delta touche ses fichiers (`infra/ci/changed_jobs.py`) —
    # sur une PR, un push vers `main` ou une release, où `deploy` attend son vert (ADR 0032,
    # ADR 0033). Sans fonction d'état, GitHub applique `success()` à ce `if` (doc « Expressions »,
    # « Status check functions », lue le 2026-10-28) : un `changes` rouge ou sauté saute ce job.
    # `mobile`, `infra` et `avis` suivent la même règle ; `apps/api/tests/test_ci_declencheurs.py`
    # la tient.
    needs: changes
    if: needs.changes.outputs.web == 'true'

    steps:
      - *extraction

      - *fusion

      # Node, à la version de `apps/web/.nvmrc`, et le cache npm : écrit ici sous l'ancre `node`,
      # que `mobile`, `infra`, `publish` et `fumee` reprennent par `*node`.
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: make web-install

      - name: Lint
        run: make web-lint

      - name: Typecheck
        run: make web-typecheck

      - name: Tests
        run: make web-test

      - name: Build
        run: make web-build

      - name: Browsers
        run: make web-browsers

      # Le projet `desktop` ; le `mobile` a son job, en parallèle (ADR 0032, décision 3). Sur un
      # runner GitHub (`GITHUB_ACTIONS`), Playwright sert le front que le pas « Build » a compilé,
      # sans le recompiler (`apps/web/playwright.config.ts`).
      - name: End-to-end + axe
        run: make web-e2e E2E_PROJECTS=desktop

      - name: Lighthouse
        run: make web-lighthouse

  mobile:
    name: Front — e2e mobile
    runs-on: ubuntu-latest

    # L'e2e du projet `mobile`, déclenché comme `web` — sur sa sortie — et en parallèle de lui
    # (ADR 0032, décision 3) : il compile le front lui-même plutôt que d'attendre `web`.
    needs: changes
    if: needs.changes.outputs.web == 'true'

    steps:
      - *extraction

      - *fusion

      - *node

      - name: Install
        run: make web-install

      - name: Build
        run: make web-build

      - name: Browsers
        run: make web-browsers

      # Sur un runner GitHub, Playwright sert le front que le pas « Build » a compilé, comme dans
      # `web`.
      - name: End-to-end + axe
        run: make web-e2e E2E_PROJECTS=mobile

  infra:
    name: Infra — configuration Compose, images, tests des images
    runs-on: ubuntu-latest

    # Même conditionnement que le job `web` : voir son commentaire. Ses fichiers : ce que les images
    # définissent ou exécutent, liste d'inclusion `INFRA` du script (ADR 0031, décision 2). Ses
    # tests des images suivent la PR, `main` et la release (ADR 0032, décision 4).
    needs: changes
    if: needs.changes.outputs.infra == 'true'

    steps:
      - *extraction

      - *fusion

      # Compose refuse de résoudre un `env_file` dont la cible manque — y compris pour un simple
      # `config`, et y compris avec `--env-file` (mesuré). Le geste est exactement celui que
      # `CONTRIBUTING.md` demande au développeur, et il vérifie en prime que `.env.example`
      # reste lisible : un exemple cassé ferait échouer ce job avant tout le reste.
      - name: Fichier d'environnement
        run: cp .env.example .env

      # Avant le build : une erreur de configuration se voit en deux secondes, la construction
      # de l'image en prend cent fois plus.
      - name: Configuration Compose
        run: make compose-config

      # Le front compilé entre dans les images (ADR 0014) : `make build` le compile s'il manque.
      # Le front se compile donc ici, comme dans `web`, `avis` et `publish` : ce job n'attend pas
      # `web`.
      - *node

      - name: Front
        run: make web-install

      # Le pilote `docker-container` est nécessaire à `--cache-to`, que le pilote par défaut ne
      # sait pas écrire. Cette action le crée **et** le sélectionne ; c'est parce que la cible
      # `build` appelle `docker buildx build` que la sélection lui parvient — `docker` tout
      # court reviendrait au pilote par défaut et l'export de cache échouerait.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Cache des couches entre deux runs. La clé suit les fichiers que les couches de
      # dépendances consomment : elle ne change donc que quand ces couches changent réellement —
      # ce qui évite aussi que le cache soit réécrit, et grossisse, à chaque run. Les paquets du
      # système, eux, suivent les dépôts de la distribution et non un fichier : l'étage
      # `paquets` qui les installe se reconstruit à chaque build (`--no-cache-filter`, ci-dessous,
      # dans `publish` et dans `avis.yml`), sans quoi le cache garderait la couche de son
      # premier build et des paquets corrigés depuis — mesuré le 2026-10-24, `backup` rouge au scan
      # (run 40103586324).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildx-cache
          key: >-
            buildx-images-${{ hashFiles('.python-version', 'pyproject.toml', 'uv.lock',
            'apps/api/pyproject.toml', 'infra/*/Dockerfile') }}
          restore-keys: buildx-images-

      # `make build` et non un `docker build` propre à la CI : la commande reste celle du
      # `Makefile`, le cache et le chargement passent par des drapeaux. `--load` matérialise
      # vraiment les images — sans lui, le pilote conteneurisé construit et jette, et les
      # étiquettes ne désigneraient rien : les tests des images les démarrent. Le job `publish`
      # reprend ce build pour publier, `avis.yml` pour scanner.
      #
      # `tag=$*` : une entrée de cache par image, dans le même dossier. `make` développe `$*` en
      # nom du service, dans la recette de `build-<service>` ; sans lui, chaque image exporterait
      # sous `latest`, et la dernière remplacerait l'entrée de l'autre (doc Docker, « Local
      # cache »).
      - name: Images
        run: make build
        env:
          DOCKER_BUILD_FLAGS: >-
            --load
            --no-cache-filter paquets
            --cache-from type=local,src=/tmp/buildx-cache,tag=$*
            --cache-to type=local,dest=/tmp/buildx-cache,tag=$*,mode=max

      # Les tests des images que l'étape précédente a chargées — le test de fumée de `caddy`, la
      # chaîne de sauvegarde de `backup` —, écrits en pytest comme ceux du back : `uv` et
      # l'environnement Python d'abord. Leur scan est au job `avis`.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Environnement Python
        run: make install

      - name: Tests des images
        run: make image-test

  avis:
    name: Avis — audit Python, audit npm, scan des images
    # Même conditionnement que le job `web` : voir son commentaire. Seulement si le delta touche
    # une entrée d'un avis — manifestes, verrous, Dockerfiles, exceptions datées, porte de
    # `pip-audit`, `avis.yml` — ou ce qui décide des jobs (`Makefile`, `ci.yml`,
    # `changed_jobs.py`), et sur une PR seulement, jamais sur `main` ni sur une release : un avis
    # porte sur l'état du monde, pas sur le merge — `avis.yml` rejoue ses portes chaque jour —, et
    # `publish` scanne avant de pousser (ADR 0032, décisions 2 et 5 ; ADR 0033). Les étapes sont
    # celles d'`avis.yml`, au commit même de ce run (doc GitHub « Reuse workflows »).
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.avis == 'true'
    uses: ./.github/workflows/avis.yml

  publish:
    name: Publication — images sur GHCR
    runs-on: ubuntu-latest

    # Sur une release publiée seulement, hors prerelease (ADR 0033), après `changes` : son pas
    # « Tag issu de main » refuse le commit d'un tag hors de `main`, et un `changes` rouge saute ce
    # job. Aucune vérification attendue : elles rejouent le commit pendant la publication, et
    # `deploy` attend leur vert (ADR 0032, décision 2). La clause `release` est écrite : sur un
    # push, `github.event.release` manque, et `null == false` y serait vrai, par la coercion que dit
    # le garde de `changes`. Le scan reste avant chaque publication.
    # `apps/api/tests/test_publication.py` tient ces réglages.
    needs: changes
    if: github.event_name == 'release' && github.event.release.prerelease == false

    # Le seul job qui écrit, et seulement dans le registre : pousser les images, supprimer leurs
    # anciennes versions. `contents: read` se répète ici — des permissions de job remplacent
    # celles du workflow, et sans lecture le checkout d'un dépôt privé échoue.
    permissions:
      contents: read
      packages: write

    # Une publication à la fois : la suivante attend la fin de celle en cours, sans l'annuler —
    # une publication coupée entre le push et la rétention laisserait un paquet à moitié tenu.
    # GitHub ne garde qu'une publication en attente : une plus récente la remplace, et seule la
    # plus récente compte. L'ordre est celui d'arrivée au job, pas celui des releases : si deux
    # releases se suivent de près et que la première arrive au job après la seconde, `latest`
    # désigne l'avant-dernière jusqu'à la release suivante — un déploiement vise l'étiquette du
    # commit, et seule la dernière release se déploie (job `deploy`).
    concurrency:
      group: publish
      cancel-in-progress: false

    steps:
      # Le jeton de ce job écrit dans le registre : il ne reste pas dans `.git/config`, où toute
      # étape suivante le lirait.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Le front compilé entre dans les images (ADR 0014) : `make build` le compile, comme dans
      # `infra`. Les scripts d'installation des paquets npm passent avant la connexion au registre.
      - *node

      - name: Front
        run: make web-install

      # Le disque du runner, libéré avant le build pour que la base de Trivy tienne : le pas
      # « Disque » d'`avis.yml` dit pourquoi.
      - name: Disque
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # Même builder que le job `infra`, pour écrire le même cache local.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Le cache des couches, sous la clé du job `infra` : restauré, puis écrit si la clé manquait.
      # Un run de release lit l'entrée de `main`, la branche par défaut, et écrit la sienne sous la
      # portée de son tag, que seule une relance de ce run relit — « Workflow runs can restore
      # caches created in either the current branch or the default branch », et « cannot restore
      # caches created for different tag names » (doc GitHub « Dependency caching », « Restrictions
      # for accessing a cache », lue le 2026-11-28). L'entrée de `main`, `infra` l'écrit au push
      # qui change la clé : chaque fichier de la clé est dans sa liste `INFRA` (ADR 0031,
      # décision 2), et une entrée existante ne se réécrit pas — « You cannot change the contents of
      # an existing cache » (même doc, lue le 2026-11-24).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildx-cache
          key: >-
            buildx-images-${{ hashFiles('.python-version', 'pyproject.toml', 'uv.lock',
            'apps/api/pyproject.toml', 'infra/*/Dockerfile') }}
          restore-keys: buildx-images-

      # Le build du job `infra`, sous le nom GHCR (brief de #15, décision 8) : même commande,
      # même cache par image (`tag=$*`), lu et écrit. Ni provenance ni SBOM (décision 7) : chacune
      # ferait de l'image un index, dont chaque manifeste entrerait au paquet comme une version
      # sans étiquette — que la rétention, qui compte toute version, supprimerait sous l'index.
      - name: Images
        run: make build IMAGE_PREFIX=ghcr.io/plecart/portfolio-
        env:
          DOCKER_BUILD_FLAGS: >-
            --load
            --no-cache-filter paquets
            --cache-from type=local,src=/tmp/buildx-cache,tag=$*
            --cache-to type=local,dest=/tmp/buildx-cache,tag=$*,mode=max
            --provenance=false
            --sbom=false

      # Le scan juste avant le push, sur les images mêmes qui partent. Nommées sans étiquette :
      # les exceptions de `.trivyignore.yaml` suivent la cible `…/portfolio-<service> (<système>
      # <version>)` du rapport, qu'une étiquette changerait. Comme dans `avis.yml`, l'étape ne
      # porte que sa commande (`apps/api/tests/test_image_scan.py`).
      - name: Scan
        run: make scan IMAGE_PREFIX=ghcr.io/plecart/portfolio-

      # Après le scan seulement : aucune étape de build ne voit l'identifiant du registre.
      - name: Connexion à GHCR
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Push
        run: make push IMAGE_PREFIX=ghcr.io/plecart/portfolio- IMAGE_TAG="$GITHUB_SHA"

      # Trois versions par paquet (décision 1), par l'API de GitHub : le dépôt dont le workflow a
      # publié un paquet en reçoit le rôle `admin`, et le jeton du job suffit à supprimer.
      - name: Rétention
        run: make prune IMAGE_PREFIX=ghcr.io/plecart/portfolio-
        env:
          GH_TOKEN: ${{ github.token }}

  fumee:
    name: Fumée — pile de production par Playwright
    runs-on: ubuntu-latest

    # Après la publication, sur une release publiée seulement, hors prerelease — la condition de
    # `publish` (ADR 0033) : la pile de production démarre des images que `publish` vient de
    # pousser, celles mêmes que `deploy` tire ensuite. Rouge, il saute `deploy`. La seule preuve en
    # CI que la pile démarre : `infra` ne démarre que des piles d'image (brief de #26).
    # `apps/api/tests/test_publication.py` tient ces réglages.
    needs: publish
    if: github.event_name == 'release' && github.event.release.prerelease == false

    # Tirer les images privées du registre (ADR 0014). `contents: read` se répète, comme dans
    # `publish` : des permissions de job remplacent celles du workflow, et un scope non nommé vaut
    # `none` (doc GitHub « Workflow syntax », `permissions`).
    permissions:
      contents: read
      packages: read

    # Un plafond, pas une durée : les installations, puis les attentes bornées de l'étape
    # « Fumée » — 300 s d'`up --wait`, 120 s d'attente du worker et au plus 120 s par commande
    # Compose au démarrage global, 30 s par scénario, le défaut de Playwright.
    timeout-minutes: 20

    steps:
      # Ce job exécute le code des paquets npm : le jeton du dépôt ne reste pas dans `.git/config`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Playwright et Chromium, comme dans le job `web`. Pas le front compilé : il est dans l'image
      # `caddy`.
      - *node

      - name: Install
        run: make web-install

      - name: Browsers
        run: make web-browsers

      # Après les installations : les scripts d'installation des paquets npm ne voient pas
      # l'identifiant du registre. Docker le garde pour les tirages de l'étape suivante, comme dans
      # `restore.yml`.
      - name: Connexion à GHCR
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}

      # Les images du commit, jamais `latest` (brief de #26, décision 2). Le tirage n'a pas
      # d'étape à lui : `up` tire toute image absente du moteur — la politique d'un service sans
      # `pull_policy` ni `build`, comme tous ceux de la pile —, et le runner neuf n'en a aucune
      # (doc Compose, `up --pull`, défaut `policy` ; `restore.yml` en dépend déjà). Sans la
      # connexion, le tirage échoue, et la fumée avec lui (mesuré sur le poste le 2026-11-05,
      # Compose 5.0.2 : 401).
      #
      # Durée, en ordre de grandeur, non mesurée sur un runner : quelques minutes. Les attentes,
      # dans l'ordre : Node et les paquets npm, comme dans `web` ; Chromium et ses dépendances
      # système ; le tirage des images ; puis la recette, 32 à 45 s sur le poste (2026-11-05) —
      # `up --wait`, chaque service attendu sain sur sa sonde ; le démarrage global, le `worker`
      # relancé après un premier appel de la liste puis attendu jusqu'à l'état « prêt » de la
      # semence, une dizaine de secondes ; les scénarios de Playwright, environ 15 s ; `down`.
      #
      # La pile est jetée par la recette, verte ou rouge. Annulé ou hors délai, le job peut la
      # laisser debout : aucune étape `if: always()` ne la rattrape, la machine du runner étant
      # détruite avec le job (doc GitHub « Using GitHub-hosted runners »).
      - name: Fumée
        run: make smoke IMAGE_PREFIX=ghcr.io/plecart/portfolio- IMAGE_TAG="$GITHUB_SHA"

  deploy:
    name: Déploiement — production par SSH
    runs-on: ubuntu-latest

    # Publication, fumée, puis déploiement : après la fumée des images du commit, elle-même après
    # leur publication — une image rouge à la fumée reste publiée, `latest` compris, mais n'est
    # jamais déployée (brief de #26, décision 2) —, et après les vérifications que la release
    # rejoue : `api` vert, `web`, `mobile` et `infra` verts ou sautés ; un rouge le bloque,
    # l'image restant publiée (ADR 0032, décision 2). `!cancelled()` remplace le `success()` que
    # GitHub applique à un `if` sans fonction d'état, sous lequel une vérification sautée sauterait
    # ce job — « If a job fails or is skipped, all jobs that need it are skipped unless the jobs use
    # a conditional expression that causes the job to continue » (doc GitHub « Workflow syntax »,
    # `jobs.<job_id>.needs`, lue le 2026-11-24) ; `needs.<job_id>.result` vaut `success`,
    # `failure`, `cancelled` ou `skipped` (doc « Contexts », `needs`, même date), et une expression
    # qui commence par `!` s'écrit dans `${{ }}` (doc « Workflow syntax », `jobs.<job_id>.if`).
    #
    # Sur une release publiée, hors prerelease — la condition de `publish` (ADR 0033) —, et
    # seulement une fois le VPS prêt : la variable de dépôt `DEPLOY_ENABLED` vaut `true` quand ses
    # secrets existent (`infra/RUNBOOK.md`). Avant, le job est sauté et le run de la release ne
    # rougit pas ; après, un secret manquant le fait échouer. Le `if` d'un job lit `vars`, jamais `secrets` (doc
    # GitHub « Contexts »). Aucun `permissions` : le jeton du workflow, en lecture, suffit à lire la
    # dernière release ; le VPS tire les images avec son propre jeton.
    # `apps/api/tests/test_deployment.py` tient ces réglages et exécute le script.
    needs: [fumee, api, web, mobile, infra]
    if: >-
      ${{ !cancelled()
      && github.event_name == 'release' && github.event.release.prerelease == false
      && vars.DEPLOY_ENABLED == 'true'
      && needs.fumee.result == 'success' && needs.api.result == 'success'
      && (needs.web.result == 'success' || needs.web.result == 'skipped')
      && (needs.mobile.result == 'success' || needs.mobile.result == 'skipped')
      && (needs.infra.result == 'success' || needs.infra.result == 'skipped') }}
    # Les secrets du VPS sont ceux de cet environnement, restreint aux tags `v*` — réglage de
    # GitHub, hors du dépôt (ADR 0033) : la règle se compare au `GITHUB_REF` du run, et un workflow
    # lancé depuis une branche ne les lit pas, même modifié (doc GitHub « Deployments and
    # environments », « Deployment branches and tags », lue le 2026-11-28).
    environment: production
    timeout-minutes: 15

    # Un déploiement à la fois, sans couper celui en cours au milieu de son `up`.
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Seule la dernière release se déploie : la publication range les runs par ordre d'arrivée, et
      # le run d'une release plus lent que celui de la suivante redéploierait l'ancien code sur un
      # schéma déjà migré — le run de la dernière déploie à sa place, s'il est vert. La dernière,
      # c'est `releases/latest` : « the most recent non-prerelease, non-draft release » (doc REST
      # « Get the latest release », lue le 2026-11-28), comparée au tag du run.
      #
      # Puis le Compose du commit sur le VPS, son étiquette — le SHA complet, jamais `latest` —
      # dans le `.env` que `infra/bootstrap.sh` y a écrit, `pull` et `up --wait`. `--wait` échoue
      # si un service ne devient pas sain, chacun ayant sa sonde (`infra/compose.yml`) ; 300 s
      # couvrent les 3 minutes après lesquelles un service qui tourne sans répondre est malade.
      #
      # La connexion n'accepte que l'hôte dont l'empreinte est épinglée par secret : jamais de
      # première connexion de confiance (`StrictHostKeyChecking=yes`, aucun `ssh-keyscan`). La clé
      # est dédiée au déploiement, sans phrase de passe, lisible du seul utilisateur du runner.
      # `$options` sans guillemets, à dessein : le shell le découpe en options — les chemins de
      # `RUNNER_TEMP` n'ont pas d'espace.
      - name: Déploiement
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          newest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$newest" != "$GITHUB_REF_NAME" ]; then
            echo "::notice::La dernière release est $newest, que son propre run déploie s'il est vert."
            exit 0
          fi
          key="$RUNNER_TEMP/deploy_key"
          known_hosts="$RUNNER_TEMP/known_hosts"
          (umask 077 && printf '%s\n' "$SSH_KEY" > "$key")
          printf '%s\n' "$KNOWN_HOSTS" > "$known_hosts"
          options="-i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30"
          scp $options infra/compose.yml "$TARGET:/srv/portfolio/compose.yml"
          ssh $options "$TARGET" "cd /srv/portfolio && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$GITHUB_SHA/' .env && docker compose pull --quiet && docker compose up -d --wait --wait-timeout 300"
