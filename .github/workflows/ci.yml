# CI générée par `init-projet` depuis la section « Commandes du projet » de
# .claude/pipeline.config.md, régénérée au scaffold du front (#3).
#
# Chaque étape appelle une cible du `Makefile` : la CI et le poste de développement exécutent
# la même commande, jamais deux définitions parallèles.
#
# Aucune version de runtime n'apparaît ici : `.python-version` et `apps/web/.nvmrc` les épinglent,
# et les actions de mise en place les lisent. Un second canal qui déclarerait une version
# finirait par diverger du premier.
#
# Trois jobs, un par pile. Ils n'ont pas les mêmes prérequis — `uv`, Node, Docker — et les
# séparer évite qu'un rouge de l'une masque un rouge d'une autre.
#
# Chaque action est épinglée par **empreinte de commit**, sa version en commentaire : une
# étiquette peut être déplacée par son propriétaire ou par un attaquant, et le déplacement
# s'exécuterait ici sans aucun signal ; une empreinte ne bouge pas. Dependabot
# (`.github/dependabot.yml`) les met à jour chaque semaine, empreinte et commentaire ensemble. Le
# commentaire porte l'étiquette la plus précise du commit (`v7.0.1`, pas `v7`) : Dependabot ne
# réécrit qu'un commentaire dont l'étiquette pointe encore sur le commit épinglé, et une étiquette
# majeure cesse d'y pointer dès qu'une version sort — précisément quand la mise à jour arrive.
# `apps/api/tests/test_supply_chain.py` refuse toute autre forme.

name: CI

# Aucune étape n'écrit sur le dépôt : le jeton ne reçoit que la lecture. Le défaut d'un dépôt
# peut être bien plus large, et il ne se resserre pas tout seul quand un workflow n'en a pas
# besoin.
permissions:
  contents: read

on:
  pull_request:
    # `ready_for_review` est INDISPENSABLE ici : sans lui, aucun événement n'est émis au passage
    # draft → ready, et la CI ne tournerait jamais sur une PR ouverte en draft (Étape 2 de
    # `cycle-pr`). Ne pas retirer ce type sans retirer aussi le garde `if:` des jobs.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  api:
    name: Back — audit, lint, format, types, tests
    runs-on: ubuntu-latest

    # Pas de CI tant que la PR est en draft.
    #
    # `cycle-pr` ouvre la PR AVANT d'écrire la moindre ligne de code (Étape 2), pour rendre le
    # travail visible comme « en cours ». Sans ce garde, chaque push de développement
    # déclencherait un run complet sur du code volontairement incomplet.
    #
    # C'est sans risque dans cette pipeline : les étapes 3.2 et 3.4 imposent une suite verte en
    # local avant chaque commit, donc aucun commit cassé n'entre dans l'historique. La CI reprend
    # au `gh pr ready` (Étape 5) et sur chaque push suivant.
    #
    # La condition sur `event_name` est nécessaire : sur un push vers `main`, l'objet
    # `pull_request` n'existe pas.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install
        run: make install

      # Avant les portes de code, comme dans le job front : un avis de sécurité sur une
      # dépendance n'a pas à attendre que la suite passe pour être signalé.
      #
      # Seuil : **toute** vulnérabilité connue bloque, là où `npm audit` s'arrête à `high`.
      # `pip-audit` n'expose aucune sévérité — ni option, ni champ dans sa sortie (2.10.1,
      # pypa/pip-audit#654) — et l'arbre Python, 59 paquets au verrou le 2026-09-25, n'a pas le
      # bruit qui justifie `high` côté npm, où l'arbre en compte dix fois plus. Un avis qui ne
      # s'applique pas ici passe par une exception datée de `infra/ci/pip-audit-exceptions.toml`,
      # jamais par un seuil relevé.
      - name: Audit
        run: make audit

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Typecheck
        run: make typecheck

      - name: Tests
        run: make test

  web:
    name: Front — lint, types, tests, build, e2e, lighthouse, audit
    runs-on: ubuntu-latest

    # Même garde que le job back : voir le commentaire ci-dessus.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: make web-install

      # Avant les portes de code : un avis de sécurité sur une dépendance livrée n'a pas à
      # attendre que la suite passe pour être signalé.
      - name: Audit
        run: make web-audit

      - name: Lint
        run: make web-lint

      - name: Typecheck
        run: make web-typecheck

      - name: Tests
        run: make web-test

      - name: Build
        run: make web-build

      - name: Browsers
        run: make web-browsers

      - name: End-to-end + axe
        run: make web-e2e

      - name: Lighthouse
        run: make web-lighthouse

  infra:
    name: Infra — configuration Compose, image api
    runs-on: ubuntu-latest

    # Même garde que les deux autres jobs : voir le commentaire du job back.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Compose refuse de résoudre un `env_file` dont la cible manque — y compris pour un simple
      # `config`, et y compris avec `--env-file` (mesuré). Le geste est exactement celui que
      # `CONTRIBUTING.md` demande au développeur, et il vérifie en prime que `.env.example`
      # reste lisible : un exemple cassé ferait échouer ce job avant tout le reste.
      - name: Fichier d'environnement
        run: cp .env.example .env

      # Avant le build : une erreur de configuration se voit en deux secondes, la construction
      # de l'image en prend cent fois plus.
      - name: Configuration Compose
        run: make compose-config

      # Le pilote `docker-container` est nécessaire à `--cache-to`, que le pilote par défaut ne
      # sait pas écrire. Cette action le crée **et** le sélectionne ; c'est parce que la cible
      # `build` appelle `docker buildx build` que la sélection lui parvient — `docker` tout
      # court reviendrait au pilote par défaut et l'export de cache échouerait.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Cache des couches entre deux runs. La clé suit les fichiers que la couche de
      # dépendances consomme : elle ne change donc que quand cette couche change réellement —
      # ce qui évite aussi que le cache soit réécrit, et grossisse, à chaque run.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/buildx-cache
          key: >-
            buildx-api-${{ hashFiles('.python-version', 'pyproject.toml', 'uv.lock',
            'apps/api/pyproject.toml', 'infra/api/Dockerfile') }}
          restore-keys: buildx-api-

      # `make build` et non un `docker build` propre à la CI : la commande reste celle du
      # `Makefile`, le cache et le chargement passent par des drapeaux. `--load` matérialise
      # vraiment l'image — sans lui, le pilote conteneurisé construit et jette, et l'étiquette
      # ne désignerait rien. #15 reprend ce build pour scanner puis publier.
      - name: Image api
        run: make build
        env:
          DOCKER_BUILD_FLAGS: >-
            --load
            --cache-from type=local,src=/tmp/buildx-cache
            --cache-to type=local,dest=/tmp/buildx-cache,mode=max
