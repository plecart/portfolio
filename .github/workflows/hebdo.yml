# Le run hebdomadaire (ADR 0031, décision 4) : ce qui ne dépend d'aucun changement tourne à heure
# fixe sur `main`, et non sur chaque PR. Trois jobs indépendants — un rouge de l'un ne masque pas
# l'autre : les portes d'avis, dont le verdict change sans commit, quand une base d'avis se publie,
# par `avis.yml`, que le job `avis` d'une PR appelle aussi ; les tests des images ; l'e2e du projet
# `mobile`, que le job `web` d'une PR ne joue pas.
#
# Un rouge d'avis se corrige sur le trunk, par la voie courte — une montée de version ou une
# exception datée —, jamais par d'autres pushes sur une PR (`cycle-pr` Étape 6, « Rouge d'avis »).
# L'échec d'un run planifié est notifié à qui a créé le workflow, ou changé sa ligne `cron` en
# dernier (doc GitHub « Notifications for workflow runs », lue le 2026-11-21).
#
# Chaque action est épinglée par empreinte (`apps/api/tests/test_supply_chain.py`).
# `apps/api/tests/test_ci_declencheurs.py` tient la forme du workflow.

name: Hebdo

# La lecture du dépôt, rien d'autre : `avis.yml`, appelé, reçoit ce jeton, que ses permissions ne
# peuvent que restreindre (doc GitHub « Reusing workflow configurations »).
permissions:
  contents: read

on:
  # Chaque lundi à 05:37 UTC, sur le dernier commit de `main`. Hors du début d'heure, où GitHub
  # retarde, voire abandonne, les runs planifiés en période de charge (doc GitHub « Events that
  # trigger workflows »).
  schedule:
    - cron: "37 5 * * 1"
  # À la main : vérifier qu'un correctif du trunk lève le rouge, sans attendre la semaine suivante.
  workflow_dispatch:

jobs:
  # Audit Python, audit npm, build et scan des images : la définition des portes d'avis, au commit
  # même de ce run (doc GitHub « Reuse workflows »).
  avis:
    uses: ./.github/workflows/avis.yml

  # Le build et les tests des images du job `infra` de `ci.yml`, qu'une PR ne joue que si son delta
  # touche ce que les images définissent ou exécutent.
  images:
    name: Images — build, tests des images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Le front compilé entre dans les images (ADR 0014) : `make build` le compile s'il manque.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Front
        run: make web-install

      # Le pilote `docker-container`, comme dans le job `infra` de `ci.yml`, pour lire son cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Le cache des couches, sous la clé du job `infra` — l'entrée que `publish` écrit pour `main` :
      # restauré ici, jamais réécrit.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildx-cache
          key: >-
            buildx-images-${{ hashFiles('.python-version', 'pyproject.toml', 'uv.lock',
            'apps/api/pyproject.toml', 'infra/*/Dockerfile') }}
          restore-keys: buildx-images-

      # Le build du job `infra` : chargé dans le moteur (`--load`), où les tests démarrent les
      # images ; l'étage `paquets` reconstruit à chaque build ; une entrée de cache par image
      # (`tag=$*`). Aucun `--cache-to` : rien ne réécrit l'entrée.
      - name: Images
        run: make build
        env:
          DOCKER_BUILD_FLAGS: >-
            --load
            --no-cache-filter paquets
            --cache-from type=local,src=/tmp/buildx-cache,tag=$*

      # Les tests des images, écrits en pytest comme ceux du back : `uv` et l'environnement Python.
      # Ni `.env` ni configuration Compose : `make image-test` ne lit pas le `.env` du dépôt
      # (`apps/api/tests/process_environment.py`), et ses piles ont leurs fichiers.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Environnement Python
        run: make install

      - name: Tests des images
        run: make image-test

  # L'e2e du seul projet `mobile` (ADR 0031, décision 4), sur le front que le job vient de
  # compiler : sur un runner GitHub, Playwright le sert sans le recompiler
  # (`apps/web/playwright.config.ts`).
  mobile:
    name: Front — e2e mobile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: make web-install

      - name: Build
        run: make web-build

      - name: Browsers
        run: make web-browsers

      - name: End-to-end + axe
        run: make web-e2e E2E_PROJECTS=mobile
