<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Miniature</title>
<!--
  Le gabarit de la miniature d'un projet : un carré qui remplit la fenêtre, en aplats et sans
  texte, calqué sur les couvertures en ligne (#290, décision 4 bis). `scripts/exporter.py`
  remplace chaque marqueur en majuscules entre `/*` et `*/` par sa ressource en ligne : la
  miniature à dessiner — son gabarit, son fond et sa couleur d'accent, les paramètres de sa
  composition en fractions du côté, les SVG de son cône et de ses icônes ou l'image de son
  premier plan en `data:` — et l'attribut que la page pose une fois rendue. Le rendu ne connaît
  aucun nom de teinte ni de composition. Aucune requête.
-->
<style>
:root { --ink: #2A2622; --paper: #FBF8F2; --shadow: rgba(42,38,34,.22); }
body { margin: 0; overflow: hidden; }
#carre { position: relative; width: 100vmin; height: 100vmin; overflow: hidden; }
#carre > * { position: absolute; }
#carre svg { display: block; width: 100%; height: 100%; }
/* « chantier » : les icônes sans cadre ; une icône Lucide trace à l'encre, un logo garde sa
   couleur. */
.icone { color: var(--ink); }
/* « mise en scène » : l'anneau, puis le premier plan, tourné autour du milieu de son haut. */
.anneau { box-sizing: border-box; border-style: solid; border-radius: 50%; }
.plan { transform-origin: 50% 0; filter: drop-shadow(0 .8vmin 2.4vmin var(--shadow)); }
.telephone { color: var(--ink); }
.telephone img { position: absolute; }
.telephone img, .fenetre img { object-fit: cover; object-position: top; }
/* La fenêtre d'une capture, au cadre sombre comme le corps du téléphone : sa barre sans texte,
   trois points. */
.fenetre { display: flex; flex-direction: column; overflow: hidden; background: var(--ink); }
.barre { flex: none; display: flex; align-items: center; gap: calc(var(--barre) * .25);
  height: var(--barre); padding: 0 calc(var(--barre) * .4); }
.barre span { width: calc(var(--barre) * .25); height: calc(var(--barre) * .25); border-radius: 50%;
  background: var(--paper); }
.fenetre img { flex: 1; min-height: 0; }
</style>

<div id="carre"></div>

<script>
const MINIATURE = /*MINIATURE*/;
// En fraction du côté de l'image : le trait du cône de « chantier », quelle que soit sa taille,
// mesuré sur les couvertures de Spell Army et de l'assistant IA (2026-11-26) ; ce qui dépasse
// sous le bas de l'image d'un premier plan coupé, assez pour que ses coins du bas n'y paraissent
// pas, tourné de quelques degrés ; la marge qu'une capture ou un schéma garde aux côtés de
// l'image, et qu'un schéma garde au-dessus du bas.
const TRAIT = .042, DEBORD = .15, MARGE = .06;
// En fraction de la largeur du premier plan, celle du téléphone : l'épaisseur du cadre sombre —
// le corps du téléphone, le bord de la fenêtre —, mesurée sur la couverture de Badge Mie, et le
// rayon des coins du téléphone, estimé sur elle (2026-11-26) ; la hauteur de la barre de la
// fenêtre et le rayon de ses coins ; la largeur d'une capture ou d'un schéma, plus larges qu'un
// téléphone — un écran de bureau, un schéma carré.
const CADRE = {bord: .034, rayon: .17, barre: .1, coin: .03, large: 1.4};

const carre = document.getElementById('carre');
const C = MINIATURE.composition, couleurs = MINIATURE.couleurs;
const vmin = fraction => fraction * 100 + 'vmin';
function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
function svg(cls, code) { const e = el('div', cls); e.innerHTML = code; return e; }
// Pose `e` dans le rectangle de largeur `l` et de hauteur `h` dont le milieu du haut est en
// (`x`, `haut`) ; `centrer`, dans le carré de côté `cote` centré en (`x`, `y`). Tout en fractions
// du côté de l'image.
function poser(e, x, haut, l, h) {
  Object.assign(e.style, {left: vmin(x - l / 2), top: vmin(haut), width: vmin(l), height: vmin(h)});
  return e;
}
const centrer = (e, x, y, cote) => poser(e, x, y - cote / 2, cote, cote);
// La hauteur d'un premier plan coupé, `P` : de son haut jusque sous le bas de l'image.
const coupe = P => 1 - P.haut + DEBORD;
// La largeur d'une capture ou d'un schéma, qui garde sa marge aux côtés de l'image.
const large = P => Math.min(CADRE.large * P.largeur, 1 - 2 * (Math.abs(P.x - .5) + MARGE));

// Chaque premier plan : le cadre qu'il pose autour de l'image décodée, à la place et à la largeur
// du premier plan `P`. Le téléphone et la capture sont coupés par le bas, l'image couvrant le
// cadre depuis son haut ; le schéma est entier.
const PREMIERS_PLANS = {
  // Le téléphone, générique et sans marque : son corps en SVG, l'écran posé dans son bord.
  telephone(image, P) {
    const l = P.largeur, h = coupe(P), bord = CADRE.bord * l, rayon = CADRE.rayon * l;
    const corps = `<rect width="${l}" height="${h}" rx="${rayon}" fill="currentColor"/>`;
    const cadre = svg('telephone', `<svg viewBox="0 0 ${l} ${h}">${corps}</svg>`);
    Object.assign(image.style, {
      left: vmin(bord), top: vmin(bord), width: vmin(l - 2 * bord), height: vmin(h - 2 * bord),
      borderRadius: vmin(rayon - bord),
    });
    cadre.append(image);
    return poser(cadre, P.x, P.haut, l, h);
  },
  // La capture dans un cadre de fenêtre.
  capture(image, P) {
    const cadre = el('div', 'fenetre'), barre = el('div', 'barre');
    cadre.style.setProperty('--barre', vmin(CADRE.barre * P.largeur));
    Object.assign(cadre.style, {
      borderRadius: vmin(CADRE.coin * P.largeur), padding: `0 ${vmin(CADRE.bord * P.largeur)}`,
    });
    barre.append(el('span'), el('span'), el('span'));
    cadre.append(barre, image);
    return poser(cadre, P.x, P.haut, large(P), coupe(P));
  },
  // Le schéma tel quel, entier : moins large s'il sortait par le bas.
  schema(image, P) {
    const rapport = image.naturalWidth / image.naturalHeight;
    const l = Math.min(large(P), (1 - MARGE - P.haut) * rapport);
    return poser(image, P.x, P.haut, l, l / rapport);
  },
};

// Chaque gabarit : ce qu'il dessine sur le fond ; une promesse s'il attend une image.
const GABARITS = {
  chantier() {
    const {cone: K, icones: I} = C;
    const cone = centrer(svg('cone', MINIATURE.cone), K.x, K.y, K.taille);
    const trace = cone.querySelector('svg');
    // Le trait, en unités du dessin : le même à l'image, quelle que soit la taille du cône.
    trace.setAttribute('stroke-width', TRAIT * trace.viewBox.baseVal.width / K.taille);
    cone.style.color = couleurs.accent;
    const icones = MINIATURE.icones.map((code, k) =>
      centrer(svg('icone', code), ...I.places[k], I.taille));
    carre.append(cone, ...icones);
  },
  'mise-en-scene'() {
    const {anneau: A, plan: P} = C, anneau = el('div', 'anneau'), image = el('img');
    centrer(anneau, A.x, A.y, A.diametre);
    Object.assign(anneau.style, {borderWidth: vmin(A.epaisseur), borderColor: couleurs.accent});
    carre.append(anneau);
    image.alt = '';
    image.src = MINIATURE.premierPlan.image;
    return image.decode().then(() => {
      const plan = PREMIERS_PLANS[MINIATURE.premierPlan.type](image, P);
      plan.classList.add('plan');
      plan.style.transform = `rotate(${P.angle}deg)`;
      carre.append(plan);
    });
  },
};

carre.style.background = couleurs.fond;
// Le dessin fait, image décodée, la page pose sur `<body>` l'attribut que l'export injecte ici et
// attend avant de capturer.
Promise.resolve(GABARITS[MINIATURE.gabarit]()).then(() => document.body.setAttribute(/*PRET*/, ''));
</script>
