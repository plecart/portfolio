# Racine de l'espace de travail `uv`. Virtuelle : elle ne s'installe pas elle-même, elle déclare
# les membres du monorepo (cadrage §9 point 2, D52) et l'outillage commun à tous.
#
# Chaque membre est aussi une dépendance de la racine : c'est ce qui fait qu'un `uv sync` nu
# installe tout l'espace de travail, sans `--all-packages`.
[project]
name = "portfolio"
version = "0"
requires-python = ">=3.12"
dependencies = ["api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

# `apps/web` est apparié par `apps/*` — motif prescrit par le cadrage §9 point 2 — mais n'est pas
# un paquet Python. Sans cette exclusion, `uv sync` refuse l'espace de travail entier (« Workspace
# member ... is missing a `pyproject.toml` », sortie 2, mesuré) et les quatre portes tombent avec
# lui. Exclure plutôt que restreindre `members` : le motif du cadrage reste intact, et la prochaine
# application Python y entre sans qu'on touche à ce fichier.
exclude = ["apps/web"]

[tool.uv.sources]
api = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "pre-commit",
    "django-stubs>=6.1.1",
    "pip-audit>=2.10.1",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
    "pytest-django>=4.14.0",
    "testcontainers>=4.15.0",
    "docker>=7.2.0",
    "jsonschema>=4.26.0",
    "celery-types>=0.26.0",
    "botocore-stubs>=1.43.120",
]

[tool.pytest.ini_options]
testpaths = ["apps"]
# Le greffon `process_environment` pose l'environnement de test — réglages Django compris — avant
# que pytest-django ne les charge, ce qu'aucun `conftest.py` ne peut faire : pytest les importe
# après. `pythonpath` le rend importable — pytest l'applique avant de charger les greffons `-p`.
# `infra/ci` : les scripts de la CI, dont les tests importent les fonctions pures.
pythonpath = ["apps/api/tests", "infra/ci"]
addopts = ["-p", "process_environment"]

# Même largeur que la prose du dépôt (règles, ADR, docstrings) : sans ça, le code se replie à
# 88 colonnes et les commentaires courent jusqu'à 100 dans le même fichier.
#
# `include` borne ruff aux fichiers Python. Sans cette ligne il formate aussi les blocs de code
# des fichiers Markdown : `make format` réécrirait alors `docs/cadrage-technique.md` (rang 1) et
# les ADR (rang 3), et `make format-check` échouerait sur une PR purement documentaire — mesuré,
# sortie 2. Les hooks pre-commit sont bornés à `[python, pyi]` : la gate couvre donc un peu plus
# qu'eux — les carnets et les `pyproject.toml` — et jamais moins. C'est le sens utile de
# l'inclusion : ce qu'un hook laisse passer, la CI le voit encore.
#
# La liste **remplace** le défaut de ruff, elle ne s'y ajoute pas : `*.ipynb` y figure donc
# explicitement, sans quoi les carnets de `docs/learning/` (phase 2) deviendraient invisibles
# aux deux portes sans que rien ne le signale.
[tool.ruff]
line-length = 100
include = ["*.py", "*.pyi", "*.ipynb", "**/pyproject.toml"]
# Les worktrees d'une vague `pr-paralleles` sont des copies complètes du dépôt : sans cette
# exclusion, `ruff check .` analyse chaque fichier deux ou trois fois et un rouge d'une branche
# en vol rougit le clone principal. `exclude` par défaut ne les couvre pas — il ne connaît ni
# `.claude/` ni les dossiers cachés en général (contrairement à pyright, qui les saute tous).
extend-exclude = [".claude/worktrees"]

# Les migrations sont écrites par `makemigrations` : leurs listes de classe (`dependencies`,
# `operations`) sont celles de Django, qu'on ne retouche pas à chaque migration. Tout le reste
# des règles s'y applique, et le hook les remet en forme.
[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["RUF012"]

[tool.pyright]
typeCheckingMode = "strict"
# `infra` : le code Python de la CI (`infra/ci`) est tenu au même mode strict. Pas sous `.github/` :
# pyright y exclut tout dossier caché, et cette exclusion l'emporte sur `include` — mesuré, une
# erreur de type délibérée y passait sans diagnostic.
include = ["apps", "infra"]
# Le `pythonpath` de pytest, vu de pyright : les modules d'appui des tests s'importent par leur nom.
extraPaths = ["apps/api/tests", "infra/ci"]
